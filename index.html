<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<title>Bóveda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600..800&family=Nunito:wght@700;800&family=Silkscreen&display=swap">
<style>
/* =====================================================================
   TOKENS: tipografía, espacios, radios y movimiento.
   Los colores de cada ambiente se generan en JS como clases .amb-<id>
   (una sola fuente de verdad: PALETTES en 01_data.js).
   ===================================================================== */
:root {
  --f-display: "Bricolage Grotesque", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Figtree", "Avenir Next", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-serif: "Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
  --f-round: ui-rounded, "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-pixel: "Silkscreen", "DM Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --r-sm: 10px;
  --r: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --gut: 16px;
  /* Escala de letra fija (SISTEMA_DE_DISENO.md, regla 3): 12, 13, 15, 17, 20 y 28 px */
  --t-12: .75rem; --t-13: .8125rem; --t-15: .9375rem; --t-17: 1.0625rem; --t-20: 1.25rem; --t-28: 1.75rem;
  --tap: 44px;
  --tabbar-h: 60px;
  --fire: #FF7A1A;
  --ice: #7DD3FC;
  --cf: #1DB954;
  --paper: #F4EFE6;
  --ink: #1C1A17;
}
/* Colores que se derivan del ambiente: se recalculan dentro de cada .amb-* (así un perfil
   puede verse con los colores de su dueño dentro de la app de quien lo visita) */
[class*="amb-"] {
  --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
  --accent-line: color-mix(in srgb, var(--accent) 45%, transparent);
  --glass: color-mix(in srgb, var(--bg) 84%, transparent);
  --glass-line: color-mix(in srgb, var(--fg) 10%, transparent);
  /* Profundidad, velos y vidrio: todo sale del ambiente (SISTEMA_DE_DISENO.md, reglas 2, 6 y 7) */
  --sh-1: 0 4px 12px -4px var(--shadow-a);
  --sh-2: 0 14px 34px -14px var(--shadow-a);
  --shadow: var(--sh-2);
  --scrim: color-mix(in srgb, var(--page) 72%, transparent);
  --glass-photo: color-mix(in srgb, var(--bg) 70%, transparent);
  --glass-blur: blur(20px) saturate(1.6);
  --on-photo-line: color-mix(in srgb, var(--fg) 30%, transparent);
  --hover: color-mix(in srgb, var(--fg) 6%, transparent);
  --press: color-mix(in srgb, var(--fg) 10%, transparent);
  color: var(--fg);
}

/* =====================================================================
   BASE: escenario (teléfono + guía en escritorio; pantalla completa en el celular)
   ===================================================================== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { background: var(--page); }
body {
  margin: 0;
  background: var(--page);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: var(--t-15);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  transition: background-color .5s var(--ease);
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
button:disabled { cursor: default; }
input, textarea, select { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
svg { display: block; }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

.stage { display: flex; gap: 48px; justify-content: center; align-items: flex-start; min-height: 100%; }
.phone {
  position: relative; flex-shrink: 0;
  width: 414px; max-width: 100%;
  height: min(876px, calc(100vh - 32px)); height: min(876px, calc(100dvh - 32px));
  border-radius: 56px; padding: 10px;
  background: linear-gradient(145deg, #2c2c35, #0c0c10 60%); /* color-ok: cuerpo del teléfono (maqueta) */
  box-shadow: 0 40px 90px rgba(0, 0, 0, .45), inset 0 0 0 1.5px rgba(255, 255, 255, .08); /* color-ok: maqueta */
}
.device {
  position: relative; height: 100%; border-radius: 46px; overflow: hidden; isolation: isolate;
  background: radial-gradient(120% 60% at 0% 0%, var(--bg-2), transparent 60%), var(--bg);
  color: var(--fg);
  transition: background-color .5s var(--ease);
}
.amb-aurora .device, .layer.amb-aurora { background: var(--bg); }
.amb-aurora .device::before, .layer.amb-aurora::before {
  content: ""; position: absolute; inset: -30%; z-index: 0; pointer-events: none; opacity: .55;
  background: radial-gradient(40% 30% at 20% 20%, color-mix(in srgb, var(--accent) 33%, transparent), transparent 70%), radial-gradient(40% 35% at 80% 30%, color-mix(in srgb, var(--accent-2) 33%, transparent), transparent 70%), radial-gradient(50% 30% at 50% 80%, color-mix(in srgb, var(--c-game) 20%, transparent), transparent 70%);
  animation: auroraMove 18s ease-in-out infinite alternate;
}
@keyframes auroraMove { 0% { transform: translate(0, 0) rotate(0); } 100% { transform: translate(6%, -4%) rotate(8deg); } }
.statusbar { position: absolute; top: 0; left: 0; right: 0; height: 50px; z-index: 60; display: flex; align-items: center; justify-content: space-between; padding: 8px 34px 0 38px; font-weight: 700; font-size: .9rem; pointer-events: none; color: var(--fg); }
.statusbar .icons { display: flex; gap: 6px; align-items: center; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 20px; background: #000; z-index: 61; pointer-events: none; } /* color-ok: isla del teléfono (hardware) */
.homebar { position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--fg); opacity: .5; z-index: 70; pointer-events: none; }
#app { position: absolute; inset: 0; z-index: 1; }
#view { position: absolute; inset: 0; }
#layers { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
#fx { position: absolute; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
/* Distancia segura bajo la barra de estado: 54 px en el marco del teléfono, la real en un celular */
:root { --safe-top: 54px; --safe-bottom: 22px; }

.scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.scroll::-webkit-scrollbar { display: none; }

@media (max-width: 760px) {
  :root { --safe-top: max(10px, env(safe-area-inset-top, 0px)); --safe-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
  body { padding: 0; }
  .stage { flex-direction: column; gap: 0; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; background: none; box-shadow: none; }
  .device { border-radius: 0; }
  .statusbar, .island, .homebar { display: none; }
  .guide { width: auto !important; padding: 32px max(16px, env(safe-area-inset-left, 0px)) 48px !important; }
}

/* guía del prototipo (solo escritorio, a un lado del teléfono) */
.guide { width: 340px; min-width: 0; padding-top: 22px; display: flex; flex-direction: column; gap: 22px; color: var(--fg); }
.guide h1 { font-family: var(--f-display); font-variation-settings: "wdth" 82; font-weight: 800; font-size: 2.5rem; line-height: .98; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.guide p { margin: 0; color: var(--muted); }
.guide h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 10px; font-weight: 800; }
.guide ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 7px; }
.guide li::marker { color: var(--accent); font-weight: 800; }
.guide .new { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: start; font-size: .875rem; }
.guide .new i { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; }
.guide-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.guide-swatches button { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .8125rem; font-weight: 700; transition: transform .2s var(--spring); }
.guide-swatches button:active { transform: scale(.95); }
.guide-swatches button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.guide-swatches span { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--glass-line); }
.guide .fine { font-size: .8125rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.chip-version { align-self: flex-start; font-family: var(--f-mono); font-size: .72rem; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }

/* tipografía */
.display { font-family: var(--f-display); font-variation-settings: "wdth" 84; font-weight: 800; letter-spacing: -.02em; line-height: 1.02; }
.h1 { font-family: var(--f-display); font-variation-settings: "wdth" 84; font-weight: 800; font-size: var(--t-28); letter-spacing: -.02em; line-height: 1.04; margin: 0; }
.h2 { font-family: var(--f-display); font-variation-settings: "wdth" 88; font-weight: 800; font-size: var(--t-20); letter-spacing: -.02em; line-height: 1.12; margin: 0; }
.h3 { font-weight: 800; font-size: var(--t-17); margin: 0; line-height: 1.25; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: var(--t-13); }
.xs { font-size: var(--t-12); }
.mono { font-family: var(--f-mono); }
.eyebrow { font-size: var(--t-12); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-width: 0; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pname { letter-spacing: -.01em; }
.mention { color: var(--accent-text); font-weight: 700; }
.amb-neon .mention { color: var(--accent-2); }

/* =====================================================================
   COMPONENTES: botones, controles, listas, barras, capas y avisos
   Regla de oro: todo lo que se toca mide al menos 44 × 44 px y nada interactivo
   se encima con otra cosa interactiva.
   ===================================================================== */

/* botones */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 12px 20px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 800; font-size: var(--t-15); line-height: 1.2; transition: transform .2s var(--spring), filter .2s, background .2s; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.btn.soft { background: var(--accent-soft); color: var(--fg); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid color-mix(in srgb, var(--danger) 55%, transparent); }
.btn.danger-solid { background: var(--danger); color: var(--bg); }
.btn.sm { width: auto; min-height: 44px; padding: 8px 16px; font-size: var(--t-13); }
.btn.grad { background: var(--grad); color: var(--accent-fg); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.link-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 8px; border-radius: 12px; font-weight: 800; color: var(--accent-text); }
.link-btn:active { background: var(--press); }
.icon-btn { flex-shrink: 0; width: var(--tap); height: var(--tap); border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--fg); transition: transform .2s var(--spring), background .2s; }
.icon-btn:active { transform: scale(.9); background: var(--press); }
.icon-btn.filled { background: var(--surface-2); border: 1px solid var(--line); }
.icon-btn svg { width: 24px; height: 24px; }
.ib-spacer { width: var(--tap); height: var(--tap); flex-shrink: 0; }
.dot-badge { position: absolute; top: -4px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: var(--t-12); font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); line-height: 1; }
.icon-btn .dot-badge { top: 4px; right: 2px; }

/* chips y selector segmentado */
.chip { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; min-width: 44px; padding: 8px 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-13); font-weight: 700; white-space: nowrap; color: var(--fg); transition: transform .2s var(--spring), background .2s, border-color .2s; }
.chip:active { transform: scale(.95); }
.chip.on, .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip svg { width: 15px; height: 15px; flex-shrink: 0; }
.chip.static { pointer-events: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px var(--gut); margin: 0 calc(-1 * var(--gut)); scroll-padding-inline: var(--gut); }
.chips::-webkit-scrollbar { display: none; }
.chips > * { flex-shrink: 0; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); padding: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { position: relative; z-index: 1; min-height: 40px; padding: 8px 8px; border-radius: 999px; font-weight: 800; font-size: var(--t-13); color: var(--muted); text-align: center; transition: color .2s; line-height: 1.15; }
.seg button[aria-pressed="true"] { color: var(--accent-fg); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n)); border-radius: 999px; background: var(--accent); transform: translateX(calc(var(--i) * 100%)); transition: transform .36s var(--spring); }

/* formularios */
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .label { font-size: var(--t-13); font-weight: 800; color: var(--muted); }
.input { width: 100%; min-height: 48px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; font-size: var(--t-17); color: var(--fg); transition: border-color .2s, box-shadow .2s; }
.input::placeholder { color: var(--faint); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: none; min-height: 88px; line-height: 1.4; }
select.input { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.search { position: relative; }
.search svg { position: absolute; left: 16px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search .input { padding-left: 40px; border-radius: 999px; background: var(--surface-2); }
.err { color: var(--danger); font-size: var(--t-13); margin: 0; font-weight: 600; }
.switch { position: relative; flex-shrink: 0; width: 56px; height: 44px; border-radius: 999px; }
.switch::before { content: ""; position: absolute; left: 2px; right: 2px; top: 8px; bottom: 8px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line); transition: background .2s, border-color .2s; }
.switch::after { content: ""; position: absolute; top: 8px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--faint); box-shadow: var(--sh-1); transition: transform .32s var(--spring), background-color .2s var(--ease); }
.switch[aria-checked="true"]::after { background: var(--accent-fg); }
.switch[aria-checked="true"]::before { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.switch:disabled { opacity: .45; }
.range { width: 100%; height: 28px; background: transparent; }
.range::-webkit-slider-runnable-track { height: 6px; border-radius: 999px; background: var(--surface-3); }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--surface), var(--sh-1); cursor: pointer; }
.range::-moz-range-track { height: 6px; border-radius: 999px; background: var(--surface-3); }
.range::-moz-range-thumb { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--surface), var(--sh-1); cursor: pointer; }

/* tarjetas y listas de ajustes */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.group { display: flex; flex-direction: column; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.group-label { font-size: var(--t-12); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 4px -4px; }
.group-note { font-size: var(--t-13); color: var(--muted); margin: -2px 4px 0; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 56px; width: 100%; text-align: left; color: var(--fg); transition: background .2s; }
.lrow + .lrow { border-top: 1px solid var(--line); }
a.lrow { text-decoration: none; }
button.lrow:active, .lrow.tap:active { background: var(--press); }
.lrow .tile { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.lrow .tile svg { width: 19px; height: 19px; }
.lrow .grow b { display: block; font-size: var(--t-15); font-weight: 700; line-height: 1.25; }
.lrow .grow span { display: block; font-size: var(--t-13); color: var(--muted); line-height: 1.3; margin-top: 1px; }
.lrow .val { font-size: var(--t-13); color: var(--muted); font-weight: 600; text-align: right; max-width: 40%; }
.lrow .chev { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.lrow.danger b { color: var(--danger); }
.radio-row { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 56px; width: 100%; text-align: left; }
.radio-row + .radio-row { border-top: 1px solid var(--line); }
.radio-row .rad { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex-shrink: 0; display: grid; place-items: center; transition: border-color .2s; }
.radio-row[aria-checked="true"] .rad { border-color: var(--accent); }
.radio-row[aria-checked="true"] .rad::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); animation: pop .32s var(--spring); }
.radio-row b { display: block; font-size: var(--t-15); }
.radio-row span.sub { display: block; font-size: var(--t-13); color: var(--muted); }
@keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.2); } 100% { transform: none; } }
.plus-chip { display: inline-flex; align-items: center; font-size: var(--t-12); font-weight: 800; letter-spacing: .04em; padding: 4px 8px; border-radius: 999px; background: var(--grad); color: var(--accent-fg); vertical-align: 2px; }

/* barra superior de cada pestaña y encabezado de páginas */
.topbar { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 4px; min-height: calc(var(--safe-top) + 52px); padding: var(--safe-top) 8px 0 var(--gut); }
.topbar::before, .page-head::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-bottom: 1px solid var(--glass-line); opacity: 0; transition: opacity .2s; pointer-events: none; }
.scrolled > .topbar::before, .scrolled > .page-head::before, .page-head.solid::before { opacity: 1; }
.topbar .title { flex: 1; min-width: 0; font-family: var(--f-display); font-variation-settings: "wdth" 84; font-weight: 800; font-size: var(--t-28); letter-spacing: -.02em; line-height: 1; }
.wordmark { flex: 1; min-width: 0; font-family: var(--f-display); font-variation-settings: "wdth" 78; font-weight: 800; font-size: var(--t-28); letter-spacing: -.03em; line-height: 1; display: flex; align-items: center; gap: 8px; }
.wordmark i { width: 22px; height: 22px; border-radius: 7px; background: var(--grad); flex-shrink: 0; position: relative; }
.wordmark i::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--accent-fg) 90%, transparent); }
.page-head { position: sticky; top: 0; z-index: 6; display: flex; align-items: center; gap: 4px; min-height: calc(var(--safe-top) + 52px); padding: var(--safe-top) 6px 0; }
.page-head .title { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: var(--t-17); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-body { padding: 8px var(--gut) 40px; display: flex; flex-direction: column; gap: 16px; }
.content { padding: 4px var(--gut) calc(var(--tabbar-h) + var(--safe-bottom) + 28px); display: flex; flex-direction: column; gap: 16px; }

/* barra inferior: fija, sin flotar sobre el contenido */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); height: calc(var(--tabbar-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.6); backdrop-filter: blur(20px) saturate(1.6); border-top: 1px solid var(--glass-line); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: var(--tabbar-h); color: var(--muted); font-size: var(--t-12); font-weight: 800; transition: color .2s; }
.tab .ti { position: relative; width: 28px; height: 28px; display: grid; place-items: center; }
.tab .ti > svg { width: 26px; height: 26px; transition: transform .3s var(--spring); }
.tab[aria-current="page"] { color: var(--fg); }
.tab:active .ti > svg { transform: scale(.86); }
.tab .tl { line-height: 1; }
.plus-sq { width: 30px; height: 30px; border-radius: 12px; display: grid; place-items: center; border: 2px solid currentColor; color: var(--fg); }
.plus-sq svg { width: 18px; height: 18px; }
.tab-create .tl { color: var(--muted); }
.tab-av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--line); }
.tab-av.on { box-shadow: 0 0 0 2px var(--fg); }

/* capas */
.layer { position: absolute; inset: 0; pointer-events: auto; isolation: isolate; }
.layer.page { background: var(--bg); color: var(--fg); transform: translateX(100%); transition: transform .42s cubic-bezier(.2, .9, .25, 1); box-shadow: -20px 0 40px var(--shadow-a); }
.layer.page.themed { background: radial-gradient(120% 50% at 100% 0%, var(--bg-2), transparent 60%), var(--bg); }
.layer.page.in { transform: none; }
.layer.page.out { transform: translateX(100%); transition-duration: .3s; }
.layer.sheet { display: flex; flex-direction: column; justify-content: flex-end; background: transparent; transition: background-color .3s, backdrop-filter .3s; }
.layer.sheet.in { background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.layer.sheet.out { background: transparent; }
.sheet-card { position: relative; max-height: 92%; display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform .45s cubic-bezier(.2, .95, .25, 1.02); box-shadow: 0 -20px 50px var(--shadow-a); }
.layer.sheet.in .sheet-card { transform: none; }
.layer.sheet.out .sheet-card { transform: translateY(100%); transition-duration: .28s; }
.sheet-body { overflow-y: auto; padding: 4px var(--gut) calc(var(--safe-bottom) + 18px); display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.sheet-body > * { flex-shrink: 0; }
.sheet-body::-webkit-scrollbar { display: none; }
.grab { width: 40px; height: 5px; border-radius: 999px; background: var(--line); margin: 8px auto 8px; flex-shrink: 0; }
.sheet-title { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.sheet-title b { flex: 1; min-width: 0; font-family: var(--f-display); font-variation-settings: "wdth" 88; font-weight: 800; font-size: var(--t-20); }
.layer.full { background: var(--page); color: var(--fg); opacity: 0; transform: scale(.97); transition: opacity .3s var(--ease), transform .38s var(--ease); }
.layer.full.in { opacity: 1; transform: none; }
.layer.full.out { opacity: 0; }
.layer.modal { display: grid; place-items: center; padding: 24px; background: transparent; transition: background-color .3s; }
.layer.modal.in { background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.modal-card { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; transform: scale(.9); opacity: 0; transition: transform .4s var(--spring), opacity .2s; }
.layer.modal.in .modal-card { transform: none; opacity: 1; }
.layer.modal.out .modal-card { transform: scale(.94); opacity: 0; }

/* avisos: salen de la isla dinámica y no bloquean toques (salvo "Deshacer") */
.toast { --tw: calc(100% - 24px); position: absolute; top: 11px; left: 50%; transform: translateX(-50%); z-index: 90; width: 122px; height: 35px; border-radius: 20px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; overflow: hidden; background: #000; color: #fff; /* color-ok: sale de la isla del teléfono (hardware, siempre negra) */ font-weight: 700; font-size: .8125rem; line-height: 1.22; box-shadow: 0 14px 34px rgba(0, 0, 0, .35); pointer-events: none; animation: islandOpen .55s cubic-bezier(.3, 1.25, .5, 1) forwards; }
.toast > * { opacity: 0; animation: fadeIn .2s .18s var(--ease) forwards; }
.toast .t-txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.toast .t-ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: #ffffff22; flex-shrink: 0; font-size: 1rem; } /* color-ok: isla */
.toast .t-undo { pointer-events: auto; min-height: 44px; padding: 0 12px; border-radius: 999px; font-weight: 800; color: #FFD84D; } /* color-ok: isla */
.toast.out { animation: islandClose .4s var(--ease) forwards; }
.toast.out > * { animation: fadeOut .12s var(--ease) forwards; opacity: 1; }
@keyframes islandOpen { from { width: 122px; height: 35px; border-radius: 16px; } to { width: var(--tw); height: 62px; border-radius: 16px; } }
@keyframes islandClose { from { width: var(--tw); height: 62px; border-radius: 16px; } 85% { opacity: 1; } to { width: 122px; height: 35px; border-radius: 16px; opacity: 0; } }
@keyframes fadeIn { to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }
@media (max-width: 760px) { .toast { top: calc(6px + env(safe-area-inset-top, 0px)); --tw: min(calc(100% - 24px), 420px); } }

/* avatares, aros y anillos */
.av { position: relative; flex-shrink: 0; width: var(--sz, 44px); height: var(--sz, 44px); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; color: #fff; font-size: calc(var(--sz, 44px) * .42); letter-spacing: -.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, .25); } /* color-ok: avatar generado (ilustración, como una foto) */
.av-wrap { position: relative; display: inline-grid; flex-shrink: 0; }
.av-ring { position: relative; flex-shrink: 0; display: inline-grid; place-items: center; padding: 4px; border-radius: 50%; background: var(--grad); }
.av-ring.seen { background: var(--line); }
.av-ring.cf { background: var(--cf); }
.av-ring > .av { box-shadow: 0 0 0 3px var(--bg); }
.cat-badge { position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 2px var(--bg); color: var(--cc, var(--accent)); overflow: hidden; }
.cat-badge svg { width: 13px; height: 13px; }
.rings { display: inline-block; flex-shrink: 0; }
.rings svg circle { transition: stroke-dashoffset 1.1s var(--ease); }
.rings .lbl { font-family: var(--f-mono); font-weight: 500; fill: var(--bg); display: none; }
.cb .rings .lbl { display: block; }
.compat-ring { position: relative; display: inline-grid; place-items: center; flex-shrink: 0; }
.compat-ring svg circle.rg { transition: stroke-dashoffset 1.2s var(--ease); }
.compat-ring .num { position: absolute; font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.thumb { position: relative; display: inline-block; flex-shrink: 0; overflow: hidden; background: var(--surface-3); }
.stackav { display: flex; }
.stackav > * { margin-left: -10px; box-shadow: 0 0 0 2px var(--surface); border-radius: 50%; }
.stackav > *:first-child { margin-left: 0; }

/* estados vacíos y esqueletos */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 12px; text-align: center; color: var(--muted); }
.empty .ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); }
.empty .ico svg { width: 26px; height: 26px; }
.empty b { color: var(--fg); font-size: var(--t-17); }
.progress { position: relative; height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.progress i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--accent); transition: width .9s var(--ease); }

/* efectos */
.heart-burst { position: absolute; left: 50%; top: 50%; z-index: 9; width: 110px; height: 110px; margin: -55px 0 0 -55px; pointer-events: none; color: var(--like); filter: drop-shadow(0 8px 20px color-mix(in srgb, var(--like) 55%, transparent)); animation: burst .9s var(--spring) forwards; }
.heart-burst svg { width: 100%; height: 100%; }
@keyframes burst { 0% { transform: scale(0) rotate(-15deg); opacity: 0; } 25% { transform: scale(1.15); opacity: 1; } 60% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.35) translateY(-30px); opacity: 0; } }
.float-emoji { position: absolute; bottom: 140px; z-index: 9; font-size: 2rem; pointer-events: none; animation: floatUp 1.4s var(--ease) forwards; }
@keyframes floatUp { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-260px) scale(1.4); opacity: 0; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.screen { position: absolute; inset: 0; }
.screen.enter { animation: screenIn .38s var(--ease); }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.flame { width: 20px; height: 20px; display: inline-block; flex-shrink: 0; }
.flame path { transform-origin: 50% 90%; animation: flameFlick 1.4s ease-in-out infinite; }
@keyframes flameFlick { 0%, 100% { transform: scale(1, 1); } 30% { transform: scale(.94, 1.06) rotate(-2deg); } 60% { transform: scale(1.04, .95) rotate(2deg); } }

/* =====================================================================
   PORTADAS GENERADAS (ilustraciones; en la app real son las portadas oficiales)
   Todo se dibuja con CSS y escala con el tamaño de la portada (unidades cqw).
   ===================================================================== */
.cv { position: relative; overflow: hidden; container-type: inline-size; isolation: isolate; background: var(--c1); color: var(--ink); flex-shrink: 0; user-select: none; }
.cv-album { aspect-ratio: 1; }
.cv-movie, .cv-book, .cv-tv { aspect-ratio: 2 / 3; }
.cv-game { aspect-ratio: 3 / 4; }
.cv.fill { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; }
.cv > * { position: absolute; z-index: 2; }
.cv .sh { z-index: 1; }
.cv .t { font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 800; font-size: 11cqw; line-height: .95; letter-spacing: -.01em; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
.cv .a { font-family: var(--f-body); font-weight: 700; font-size: 5.6cqw; line-height: 1.1; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84%; }
.cv .up { text-transform: uppercase; }
.cv .serif { font-family: var(--f-serif); font-variation-settings: normal; font-weight: 700; letter-spacing: 0; }
.cv .it { font-style: italic; }
.cv .cond { font-variation-settings: "wdth" 75; text-transform: uppercase; font-size: 14cqw; line-height: .9; }
.cv .huge { font-family: var(--f-display); font-variation-settings: "wdth" 75; font-weight: 800; font-size: 62cqw; line-height: .8; left: -4%; top: -6%; color: var(--c3); opacity: .9; white-space: nowrap; }
/* posiciones comunes */
.cv .bl { left: 8%; right: 8%; bottom: 7%; }
.cv .tl { left: 8%; top: 7%; }
.cv .tr { right: 8%; top: 7%; text-align: right; }
.cv .tl2 { left: 8%; right: 8%; top: 8%; }
.cv .bc { left: 8%; right: 8%; bottom: 6%; text-align: center; max-width: none; }
.cv .ctr { left: 10%; right: 10%; top: 50%; transform: translateY(-50%); text-align: center; }
.cv .top { left: 8%; right: 8%; top: 6%; text-align: center; max-width: none; text-transform: uppercase; letter-spacing: .08em; font-size: 4.6cqw; }
.cv .top2 { left: 8%; right: 8%; top: 8%; text-align: center; }
.cv .mid { left: 7%; right: 7%; top: 50%; transform: translateY(-50%); text-align: center; }

/* ---------- DISCOS ---------- */
.cv-album.L0 { background: var(--c1); }
.cv-album.L0 .sun { width: 62%; aspect-ratio: 1; border-radius: 50%; right: -8%; top: 8%; background: var(--c2); box-shadow: 0 0 0 6cqw color-mix(in srgb, var(--c2) 35%, transparent); }
.cv-album.L0 .a { left: 8%; bottom: 25%; }
.cv-album.L0 .t { left: 8%; right: 30%; bottom: 7%; font-size: 10cqw; }
.cv-album.L1 { background: repeating-linear-gradient(120deg, var(--c1) 0 11%, var(--c3) 11% 22%); }
.cv-album.L1 .box { left: 14%; right: 14%; top: 50%; transform: translateY(-50%); padding: 8% 7%; background: var(--c4); color: #1a1a1a; text-align: center; box-shadow: 0 2cqw 6cqw rgba(0, 0, 0, .3); }
.cv-album.L1 .box > * { position: static; display: block; }
.cv-album.L1 .box .t { font-size: 10cqw; -webkit-line-clamp: 2; display: -webkit-box; }
.cv-album.L1 .box .a { margin: 3cqw auto 0; font-size: 5cqw; max-width: 100%; }
.cv-album.L2 { background: var(--c2); color: var(--c3); }
.cv-album.L2 .t { color: var(--c3); font-size: 8.5cqw; }
.cv-album.L2 .a { color: var(--c3); }
.cv-album.L3 { background: var(--c4); color: #1a1a1a; }
.cv-album.L3 .b1 { width: 56%; aspect-ratio: 1; border-radius: 50%; background: var(--c2); left: 8%; top: 16%; }
.cv-album.L3 .b2 { width: 40%; aspect-ratio: 1; background: var(--c3); right: 10%; top: 34%; transform: rotate(14deg); }
.cv-album.L3 .b3 { width: 46%; aspect-ratio: 1; background: var(--c1); right: 26%; top: 44%; clip-path: polygon(50% 0, 100% 100%, 0 100%); mix-blend-mode: multiply; }
.cv-album.L3 .t { font-size: 9cqw; }
.cv-album.L4 { background: radial-gradient(circle at 30% 30%, var(--c2), var(--c1) 55%, var(--c3)); }
.cv-album.L4::after { content: ""; position: absolute; inset: 0; z-index: 1; opacity: .25; background: repeating-radial-gradient(circle at 70% 80%, rgba(255, 255, 255, .5) 0 1px, transparent 1px 4px); }
.cv-album.L4 .t { font-size: 12cqw; }
.cv-album.L5 { background: linear-gradient(160deg, var(--c2), var(--c1)); }
.cv-album.L5 .head { width: 30%; aspect-ratio: 1; border-radius: 50%; background: var(--c3); left: 35%; top: 34%; }
.cv-album.L5 .body { width: 64%; height: 40%; border-radius: 50% 50% 0 0; background: var(--c3); left: 18%; bottom: -8%; }
.cv-album.L5 .t { font-size: 9cqw; color: var(--ink); }
.cv-album.L5 .a { color: var(--ink); left: 8%; right: auto; bottom: 7%; }

/* ---------- PELÍCULAS ---------- */
.cv-movie.L0 { background: linear-gradient(180deg, var(--c3), var(--c1) 45%, var(--c2) 70%); }
.cv-movie.L0 .sun { width: 46%; aspect-ratio: 1; border-radius: 50%; left: 27%; top: 30%; background: var(--c4); opacity: .9; }

.cv-movie.L0 .t { left: 7%; right: 7%; bottom: 7%; text-align: center; color: #fff; }
.cv-movie.L0 .a { color: #fff; }
.cv-movie.L1 { background: var(--c3); color: #fff; }
.cv-movie.L1 .eye { width: 54%; aspect-ratio: 1; border-radius: 50%; left: 23%; top: 40%; background: radial-gradient(circle, var(--c2) 0 22%, transparent 23%), radial-gradient(circle, transparent 0 52%, var(--c2) 53% 58%, transparent 59%); }
.cv-movie.L1 .t { color: #fff; font-size: 12cqw; }
.cv-movie.L1 .a { color: #fff; }
.cv-movie.L2 { background: var(--c2); }
.cv-movie.L2 .split { inset: 0; background: linear-gradient(160deg, var(--c1) 0 50%, transparent 50%); }
.cv-movie.L2 .band { left: 0; right: 0; top: 40%; padding: 6% 7%; background: var(--c3); color: #fff; text-align: center; }
.cv-movie.L2 .band .t { position: static; color: #fff; }
.cv-movie.L2 .a { color: var(--ink); }
.cv-movie.L3 { background: radial-gradient(110% 70% at 50% 25%, var(--c2), var(--c1) 60%, var(--c3)); color: #fff; }
.cv-movie.L3 .t { color: #fff; font-size: 15cqw; top: 46%; }
.cv-movie.L3 .a { color: #fff; }
.cv-movie.L3 .credits { left: 12%; right: 12%; bottom: 6%; height: 9%; background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .75) 0 1.6cqw, transparent 1.6cqw 3.4cqw); opacity: .7; }

/* ---------- LIBROS ---------- */
.cv-book.L0 { background: var(--c4); color: #1a1a1a; }
.cv-book.L0 .bandT { left: 0; right: 0; top: 0; height: 24%; background: var(--c2); }
.cv-book.L0 .bandB { left: 0; right: 0; bottom: 0; height: 22%; background: var(--c2); }
.cv-book.L0 .emblem { width: 14%; aspect-ratio: 1; border-radius: 50%; left: 43%; bottom: 5%; background: var(--c4); z-index: 2; }
.cv-book.L0 .pagebox { left: 8%; right: 8%; top: 28%; bottom: 26%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 4cqw; }
.cv-book.L0 .pagebox > * { position: static; }
.cv-book.L0 .t { font-size: 11cqw; color: #1a1a1a; -webkit-line-clamp: 4; }
.cv-book.L0 .a { color: #444; font-size: 5.4cqw; max-width: 100%; }
.cv-book.L1 { background: var(--c1); }

.cv-book.L2 { background: var(--c4); color: #1a1a1a; }
.cv-book.L2 .author { left: 8%; right: 8%; top: 7%; max-width: none; font-family: var(--f-display); font-variation-settings: "wdth" 76; font-weight: 800; font-size: 11cqw; text-transform: uppercase; white-space: normal; line-height: .95; color: var(--c2); opacity: 1; }
.cv-book.L2 .blob { width: 70%; aspect-ratio: 1; left: 15%; top: 34%; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; background: var(--c2); opacity: .85; }

.cv-book.L3 { background: radial-gradient(var(--c2) 18%, transparent 19%) 0 0 / 14cqw 14cqw, var(--c1); }
.cv-book.L3 .label { left: 12%; right: 12%; top: 30%; padding: 9% 7%; background: var(--c4); color: #1a1a1a; text-align: center; display: flex; flex-direction: column; gap: 3cqw; box-shadow: 0 2cqw 5cqw rgba(0, 0, 0, .25); }
.cv-book.L3 .label > * { position: static; }
.cv-book.L3 .t { font-size: 11cqw; color: #1a1a1a; }
.cv-book.L3 .a { color: #444; margin: 0 auto; }

/* ---------- VIDEOJUEGOS ---------- */
.cv-game.L0 { background: linear-gradient(180deg, var(--c2), var(--c1)); color: #fff; }
