.cv-game.L0 .ground { left: 0; right: 0; bottom: 0; height: 22%; background: repeating-linear-gradient(90deg, var(--c3) 0 12.5%, color-mix(in srgb, var(--c3) 70%, #000) 12.5% 25%); }
.cv-game.L0 .logo { left: 6%; right: 6%; top: 32%; text-align: center; }
.cv-game .logo { font-family: var(--f-display); font-variation-settings: "wdth" 78; font-weight: 800; font-size: 13cqw; line-height: .9; color: #fff; text-transform: uppercase; -webkit-text-stroke: .5cqw #111; paint-order: stroke fill; text-shadow: 0 1.4cqw 0 #111; }
.cv-game.L1 { background: var(--c3); color: #fff; }
.cv-game.L1 .glow { width: 110%; aspect-ratio: 1; left: -5%; top: 4%; border-radius: 50%; background: radial-gradient(circle, var(--c2), transparent 62%); opacity: .8; }
.cv-game.L1 .hero { width: 46%; height: 46%; left: 27%; bottom: 18%; background: var(--c1); clip-path: polygon(50% 0, 92% 100%, 8% 100%); }
.cv-game.L1 .herohead { width: 18%; aspect-ratio: 1; border-radius: 50%; left: 41%; bottom: 60%; background: var(--c1); }
.cv-game.L1 .logo { font-size: 11cqw; }
.cv-game.L1 .a { color: #fff; }
.cv-game.L2 { background: linear-gradient(180deg, #120428, #3b0a56 55%, #08020f 55%); color: #fff; }
.cv-game.L2 .synsun { width: 64%; aspect-ratio: 1; left: 18%; top: 14%; border-radius: 50%; background: repeating-linear-gradient(180deg, var(--c2) 0 7%, transparent 7% 10%), linear-gradient(180deg, #FFD84D, var(--c2)); -webkit-mask: linear-gradient(#000 0 60%, transparent 60%); mask: linear-gradient(#000 0 60%, transparent 60%); }
.cv-game.L2 .grid { left: -30%; right: -30%; bottom: 0; height: 45%; background: repeating-linear-gradient(90deg, var(--c2) 0 .5cqw, transparent .5cqw 10%), repeating-linear-gradient(180deg, var(--c2) 0 .5cqw, transparent .5cqw 14%); transform: perspective(40cqw) rotateX(55deg); transform-origin: 50% 100%; opacity: .7; }
.cv-game .chrome { left: 6%; right: 6%; top: 44%; text-align: center; font-family: var(--f-display); font-variation-settings: "wdth" 78; font-weight: 800; font-size: 13cqw; line-height: .9; text-transform: uppercase; background: linear-gradient(180deg, #fff, #9be7ff 48%, #3b0a56 52%, #ff9be0); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 .8cqw 0 #000); }
.cv-game.L3 { background: conic-gradient(var(--c1) 25%, var(--c2) 0 50%, var(--c1) 0 75%, var(--c2) 0) 0 0 / 16cqw 16cqw; }
.cv-game.L3 .label { left: 10%; right: 10%; top: 32%; padding: 8% 6%; background: #111; color: #fff; text-align: center; display: flex; flex-direction: column; gap: 3cqw; border: 1cqw solid #fff; }
.cv-game.L3 .label > * { position: static; }
.cv-game.L3 .logo { font-size: 10cqw; text-shadow: none; -webkit-text-stroke: 0; }
.cv-game.L3 .a { color: #ddd; margin: 0 auto; }

/* ---------- SERIES ---------- */
.cv-tv.L0 { background: linear-gradient(180deg, var(--c1), var(--c3)); color: #fff; }
.cv-tv.L0 .t { color: #fff; font-size: 15cqw; }
.cv-tv.L0 .a { color: #fff; }
.cv-tv .season { left: 50%; bottom: 7%; transform: translateX(-50%); padding: 2% 6%; border: .5cqw solid currentColor; border-radius: 99px; font-size: 4.4cqw; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #fff; white-space: nowrap; }
.cv-tv.L1 { background: var(--c2); }
.cv-tv.L1 .trio { left: 0; right: 0; bottom: 0; height: 56%; background: radial-gradient(circle at 22% 22%, var(--c3) 0 9%, transparent 9.5%), radial-gradient(circle at 50% 16%, var(--c3) 0 10%, transparent 10.5%), radial-gradient(circle at 78% 22%, var(--c3) 0 9%, transparent 9.5%), radial-gradient(ellipse 18% 40% at 22% 70%, var(--c3) 98%, transparent), radial-gradient(ellipse 20% 46% at 50% 68%, var(--c3) 98%, transparent), radial-gradient(ellipse 18% 40% at 78% 70%, var(--c3) 98%, transparent); }
.cv-tv.L1 .t { color: var(--ink); }
.cv-tv.L1 .a { color: var(--ink); }
.cv-tv.L2 { background: var(--c3); color: #fff; }
.cv-tv.L2 .huge { color: var(--c2); }
.cv-tv.L2 .t { color: #fff; }
.cv-tv.L2 .a { color: #fff; }

/* fotos (ilustraciones de ejemplo o fotos subidas) */
.scene { display: block; width: 100%; height: 100%; object-fit: cover; }

/* =====================================================================
   OBJETOS DE LA BÓVEDA: vinil que gira, libro que se abre, cinta que corre,
   tele que se enciende y cartucho que arranca. Se usan en las favoritas del
   perfil, en el visor de cada obra y en lo que publicas sin foto.
   ===================================================================== */
.obj { position: relative; flex-shrink: 0; cursor: pointer; --s: 100px; transition: transform .3s var(--spring); }
.obj:active { transform: scale(.96); }
.obj-tag { position: absolute; top: -6px; left: -6px; z-index: 6; min-width: 18px; height: 18px; border-radius: 6px; background: var(--fg); color: var(--bg); font-family: var(--f-mono); font-size: .62rem; display: none; place-items: center; padding: 0 4px; }
.cb .obj-tag { display: grid; }

/* vinil */
.vinyl { width: calc(var(--s) * 1.32); height: var(--s); }
.vinyl .sleeve { position: absolute; left: 0; top: 0; width: var(--s); height: var(--s); border-radius: 6px; overflow: hidden; z-index: 3; box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255, 255, 255, .08); transition: transform .5s var(--ease); }
.vinyl .sleeve::before { content: ""; position: absolute; inset: 0; z-index: 4; background: linear-gradient(115deg, rgba(255, 255, 255, .16), transparent 30%); pointer-events: none; }
.vinyl .platter { position: absolute; top: 2%; left: calc(var(--s) * .3); width: calc(var(--s) * .96); height: calc(var(--s) * .96); z-index: 2; transition: transform .6s var(--ease); }
.vinyl .disc { position: absolute; inset: 0; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, #0d0d0f 0 1.2px, #1d1d22 1.6px 2.8px); box-shadow: 0 8px 18px -6px rgba(0, 0, 0, .7); animation: spin 9s linear infinite; }
.vinyl .disc .label { position: absolute; inset: 31%; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px rgba(0, 0, 0, .5); }
.vinyl .disc .hole { position: absolute; left: 50%; top: 50%; width: 7%; height: 7%; transform: translate(-50%, -50%); border-radius: 50%; background: #e8e8e8; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .6); }
.vinyl .sheen { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 8%, rgba(255, 255, 255, .16) 13%, transparent 20% 52%, rgba(255, 255, 255, .1) 60%, transparent 68%); pointer-events: none; }
.vinyl.playing .platter { transform: translateX(calc(var(--s) * .22)); }
.vinyl.playing .disc { animation-duration: 1.7s; }
.vinyl.playing .sleeve { transform: translateX(calc(var(--s) * -.06)) rotate(-3deg); }
.soft .vinyl:not(.playing) .disc, .rm .vinyl .disc { animation-play-state: paused; }
@keyframes spin { to { transform: rotate(360deg); } }

/* libro */
.book { width: calc(var(--s) * .76); height: calc(var(--s) * 1.08); perspective: 700px; transition: transform .3s var(--spring), translate .8s cubic-bezier(.4, .1, .2, 1); }
.book .b-inside { position: absolute; inset: 0 0 0 2px; border-radius: 2px 6px 6px 2px; background: var(--paper); color: var(--ink); box-shadow: inset 8px 0 14px -6px rgba(0, 0, 0, .3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6%; padding: 12% 10%; text-align: center; overflow: hidden; }
.book .b-mini { position: relative; width: 64%; aspect-ratio: 3 / 4; border-radius: 3px; overflow: hidden; box-shadow: 0 3px 8px rgba(0, 0, 0, .25); }
.book .b-inside b { font-family: var(--f-serif); font-size: calc(var(--s) * .085); line-height: 1.05; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.book .b-inside small { font-size: calc(var(--s) * .06); opacity: .7; }
.book::after { content: ""; position: absolute; right: -5px; top: 4px; bottom: 4px; width: 6px; border-radius: 0 3px 3px 0; background: repeating-linear-gradient(180deg, #efe9de 0 1px, #cfc6b6 1px 2px); z-index: 0; }
.book .leaf { position: absolute; inset: 1px 1px 1px 2px; border-radius: 1px 5px 5px 1px; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .1) 0 2px, transparent 2px 7px) content-box, var(--paper); padding: 14% 14% 16% 12%; transform-origin: left center; transition: transform .7s cubic-bezier(.45, .05, .3, 1); box-shadow: inset -6px 0 10px -6px rgba(0, 0, 0, .25); z-index: 2; }
.book .cover { position: absolute; inset: 0; z-index: 4; transform-origin: left center; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.4, .1, .2, 1); }
.book .cover > div { position: absolute; inset: 0; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
.book .cv-front { border-radius: 2px 6px 6px 2px; box-shadow: 0 10px 18px -8px rgba(0, 0, 0, .6); }
.book .cv-front::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 9%; z-index: 3; background: linear-gradient(90deg, rgba(0, 0, 0, .45), rgba(255, 255, 255, .14) 60%, rgba(0, 0, 0, .2)); }
.book .cv-back { transform: rotateY(180deg); border-radius: 6px 2px 2px 6px; display: grid; place-items: center; color: color-mix(in srgb, var(--ink) 70%, transparent); background: color-mix(in srgb, var(--paper) 88%, var(--accent) 12%); box-shadow: inset -10px 0 16px -8px rgba(0, 0, 0, .3); }
.book .exlibris { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9% 12%; border: 1.5px solid currentColor; border-radius: 50% / 40%; font-family: var(--f-serif); font-style: italic; font-weight: 700; font-size: calc(var(--s) * .07); line-height: 1.1; text-align: center; }
.book .exlibris b { font-family: var(--f-mono); font-style: normal; font-weight: 500; font-size: .7em; }
.book.open .cover { transform: rotateY(-158deg); }
.stage-box .book.open, .hero-obj .book.open { translate: calc(var(--s) * .38) 0; }
.book.open .leaf.l1 { transform: rotateY(-150deg); transition-delay: .18s; }
.book.open .leaf.l2 { transform: rotateY(-142deg); transition-delay: .34s; }
.book.open .leaf.l3 { transform: rotateY(-134deg); transition-delay: .5s; }
.book .leaf.l1 { z-index: 3; }

/* película */
.film { width: calc(var(--s) * .86); height: calc(var(--s) * 1.08); border-radius: 6px; background: #0b0b0d; overflow: hidden; box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .6), inset 0 0 0 1px rgba(255, 255, 255, .06); }
.film .holes { position: absolute; top: 0; bottom: 0; width: 13%; background-image: linear-gradient(180deg, #e9e3d7 0 58%, transparent 58% 100%); background-size: 52% calc(var(--s) * .11); background-repeat: repeat-y; background-position: center 2px; opacity: .92; }
.film .holes.l { left: 0; }
.film .holes.r { right: 0; }
.film .window { position: absolute; left: 15%; right: 15%; top: 0; bottom: 0; overflow: hidden; }
.film .reel { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; }
.film .frame { position: relative; height: calc(var(--s) * 1.08); flex-shrink: 0; }
.film .frame .cv { inset: 10% 0; height: auto; border-radius: 2px; }
.film .flick { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, rgba(255, 244, 214, .35), transparent 65%); opacity: 0; }
.film .badge-fps { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); z-index: 4; font-family: var(--f-mono); font-size: calc(var(--s) * .07); color: #e9e3d7; opacity: .7; letter-spacing: .08em; white-space: nowrap; }
.film.playing .reel { animation: reelRun .32s linear infinite; }
.film.playing .holes { animation: holesRun .32s linear infinite; }
.film.playing .flick { animation: flicker .16s steps(2) infinite; }
@keyframes reelRun { to { transform: translateY(calc(var(--s) * -1.08)); } }
@keyframes holesRun { to { background-position: center calc(var(--s) * -.11 + 2px); } }
@keyframes flicker { 0% { opacity: .2; } 50% { opacity: .65; } 100% { opacity: .1; } }

/* televisión */
.tv { width: calc(var(--s) * 1.16); height: var(--s); }
.tv .ant { position: absolute; left: 50%; top: 0; width: 0; height: 18%; z-index: 0; }
.tv .ant i { position: absolute; bottom: 0; left: -1px; width: 2px; height: calc(var(--s) * .2); background: color-mix(in srgb, var(--fg) 55%, transparent); border-radius: 2px; transform-origin: bottom center; }
.tv .ant i:first-child { transform: rotate(-32deg); }
.tv .ant i:last-child { transform: rotate(28deg); }
.tv .ant::after { content: ""; position: absolute; left: -7px; bottom: -3px; width: 14px; height: 7px; border-radius: 7px 7px 0 0; background: color-mix(in srgb, var(--fg) 45%, transparent); }
.tv .body { position: absolute; left: 0; right: 0; top: 16%; bottom: 7%; border-radius: 14px; padding: 7% 6% 7% 7%; display: flex; gap: 6%; background: linear-gradient(160deg, #a77a4a, #5b3d22); box-shadow: 0 10px 20px -8px rgba(0, 0, 0, .6), inset 0 2px 0 rgba(255, 255, 255, .2), inset 0 -3px 0 rgba(0, 0, 0, .25); z-index: 1; }
.tv .screen { position: relative; flex: 1; border-radius: 18% / 22%; overflow: hidden; background: #050505; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .55), inset 0 0 18px rgba(0, 0, 0, .9); }
.tv .scan { position: absolute; inset: 0; z-index: 3; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); pointer-events: none; animation: scanDrift 6s linear infinite; }
.tv .glass { position: absolute; inset: 0; z-index: 4; border-radius: inherit; background: radial-gradient(120% 90% at 30% 20%, rgba(255, 255, 255, .18), transparent 45%); pointer-events: none; }
.tv .noise { position: absolute; inset: -40%; z-index: 2; opacity: 0; background-size: 120px 120px; pointer-events: none; }
.tv .panel { width: 18%; display: flex; flex-direction: column; align-items: center; gap: 10%; padding-top: 4%; }
.tv .knob { width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0e6d6, #8c7a63 70%); box-shadow: 0 2px 3px rgba(0, 0, 0, .4); position: relative; transition: transform .5s var(--spring); }
.tv .knob::after { content: ""; position: absolute; left: 46%; top: 8%; width: 8%; height: 40%; background: #3b3026; border-radius: 2px; }
.tv .grill { width: 100%; flex: 1; border-radius: 3px; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .35) 0 2px, transparent 2px 4px); }
.tv .feet { position: absolute; left: 14%; right: 14%; bottom: 0; height: 9%; display: flex; justify-content: space-between; }
.tv .feet i { width: 10%; height: 100%; background: #2b2118; border-radius: 0 0 3px 3px; }
.tv.on .screen .cv { animation: crtOn .9s var(--ease); }
.tv.on .noise { animation: noiseFade .9s steps(6) forwards; }
.tv.on .knob:first-child { transform: rotate(90deg); }
.soft .tv .scan, .rm .tv .scan { animation: none; }
@keyframes scanDrift { to { background-position: 0 30px; } }
@keyframes crtOn { 0% { transform: scale(1, .006); filter: brightness(5); } 35% { transform: scale(1, .006); filter: brightness(5); } 65% { transform: scale(1, 1.02); filter: brightness(1.8) saturate(1.4); } 100% { transform: none; filter: none; } }
@keyframes noiseFade { 0% { opacity: .9; transform: translate(0, 0); } 20% { transform: translate(-10%, 5%); } 40% { opacity: .8; transform: translate(6%, -8%); } 60% { transform: translate(-4%, 9%); } 80% { opacity: .3; } 100% { opacity: 0; transform: translate(3%, -2%); } }

/* cartucho */
.cart { width: calc(var(--s) * .92); height: calc(var(--s) * 1.04); }
.cart .shell { position: absolute; inset: 0; border-radius: 9px 9px 5px 5px; clip-path: polygon(0 0, 84% 0, 100% 11%, 100% 100%, 0 100%); background: linear-gradient(180deg, #b9bdcb, #70758a); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35), inset 0 -4px 0 rgba(0, 0, 0, .3); transition: box-shadow .3s; }
.cart .grip { position: absolute; top: 4%; left: 14%; right: 22%; height: 9%; border-radius: 2px; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .3) 0 2px, rgba(0, 0, 0, .18) 2px 5px); }
.cart .lbl { position: absolute; left: 9%; right: 9%; top: 18%; bottom: 19%; border-radius: 5px; overflow: hidden; box-shadow: 0 0 0 2px rgba(0, 0, 0, .35); }
.cart .pins { position: absolute; left: 20%; right: 20%; bottom: 4%; height: 9%; background: repeating-linear-gradient(90deg, #e2b33b 0 3px, transparent 3px 6px); border-radius: 1px; opacity: .9; }
.cart .start { position: absolute; left: 50%; top: -18%; transform: translateX(-50%); white-space: nowrap; font-family: var(--f-pixel); font-size: calc(var(--s) * .1); color: var(--accent-text); text-shadow: 0 0 8px var(--accent); opacity: 0; z-index: 5; }
.cart.playing { animation: cartIn .7s var(--spring); }
.cart.playing .shell { box-shadow: inset 0 2px 0 rgba(255, 255, 255, .25), 0 0 0 2px var(--accent), 0 0 24px var(--accent); }
.cart.playing .start { animation: blink .5s steps(2) 3; }
@keyframes cartIn { 0% { transform: translateY(0); } 30% { transform: translateY(-14%) rotate(-3deg); } 65% { transform: translateY(5%); } 100% { transform: none; } }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
.pixel { position: absolute; width: 6px; height: 6px; z-index: 7; pointer-events: none; animation: pixelOut .7s var(--ease) forwards; }
@keyframes pixelOut { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }

/* estante (favoritas) */
.shelf-row { display: flex; align-items: flex-end; gap: 18px; overflow-x: auto; overflow-y: visible; padding: 16px var(--gut) 8px; margin: 0 calc(-1 * var(--gut)); scrollbar-width: none; scroll-snap-type: x mandatory; scroll-padding-left: var(--gut); }
.shelf-row::-webkit-scrollbar { display: none; }
.shelf-board { height: 12px; border-radius: 3px 3px 8px 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--surface-3) 80%, var(--fg) 8%), var(--surface-2)); box-shadow: 0 14px 18px -10px var(--shadow-a), inset 0 1px 0 color-mix(in srgb, var(--fg) 14%, transparent); }
.obj-wrap { display: flex; flex-direction: column; align-items: flex-start; flex-shrink: 0; scroll-snap-align: start; }
.obj-cap { width: 100%; margin-top: 8px; font-size: .75rem; font-weight: 700; line-height: 1.2; color: var(--fg); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.obj-cap span { display: block; font-weight: 600; color: var(--muted); font-size: .6875rem; }

/* =====================================================================
   PANTALLAS (1/2): bienvenida, registro, inicio, publicaciones y crear
   ===================================================================== */

/* ---------- bienvenida: pared de portadas en movimiento ---------- */
.onb { background: radial-gradient(120% 60% at 0% 0%, var(--bg-2), transparent 60%), var(--bg); }
.welcome { position: absolute; inset: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
.wall { position: absolute; inset: 0 0 34% 0; overflow: hidden; }
.wall-rows { position: absolute; left: -30%; right: -30%; top: -6%; display: flex; flex-direction: column; gap: 12px; transform: rotate(-9deg); transform-origin: 50% 0; }
.wrow { overflow: visible; }
.wtrack { display: flex; gap: 12px; width: max-content; animation: marquee var(--dur, 70s) linear infinite; will-change: transform; }
.wrow.rev .wtrack { animation-direction: reverse; }
.wcell { display: block; flex-shrink: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 24px -12px var(--shadow-a); }
.wcell .cv { height: 100%; width: auto; }
.welcome.still .wtrack, .rm .wtrack { animation: none; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.wscrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 55%, transparent) 0%, transparent 14%, transparent 28%, color-mix(in srgb, var(--bg) 70%, transparent) 44%, var(--bg) 56%); }
.wcta { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; padding: 0 22px calc(var(--safe-bottom) + 18px); }
.wm-big { font-size: 2.6rem; flex: none; }
.wm-big i { width: 32px; height: 32px; border-radius: 10px; }
.wm-big i::after { inset: 8px; border-width: 3px; }
.wtitle { margin: 0; font-family: var(--f-display); font-variation-settings: "wdth" 80; font-weight: 800; font-size: var(--t-28); line-height: 1; letter-spacing: -.025em; text-wrap: balance; }
.wsub { margin: 0 0 8px; color: var(--muted); font-size: var(--t-17); max-width: 34ch; }
.link-btn .u { text-decoration: underline; text-underline-offset: 3px; margin-left: 4px; }
@media (max-height: 760px) { .wtitle { font-size: var(--t-28); } .wsub { font-size: var(--t-15); } .wm-big { font-size: 2.1rem; } }

/* ---------- registro ---------- */
.onb-pad { min-height: 100%; display: flex; flex-direction: column; gap: 16px; padding: var(--safe-top) var(--gut) 40px; }
.onb-head { display: flex; align-items: center; gap: 8px; margin: 2px -8px 0; min-height: 48px; }
.steps { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.steps i { height: 4px; border-radius: 999px; background: var(--line); transition: background .3s; }
.steps i.on { background: var(--accent); }
.onb-title { margin-top: 8px; font-size: var(--t-28); }
.onb-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 16px var(--gut) calc(var(--safe-bottom) + 14px); background: linear-gradient(transparent, var(--bg) 34%); }
.terms-row { padding: 12px 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.pick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pick { position: relative; border-radius: 12px; overflow: hidden; transition: transform .2s var(--spring), box-shadow .2s; }
.pick .cv { width: 100%; }
.pick.on { transform: scale(.94); box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.pick .ok { position: absolute; top: 8px; right: 8px; z-index: 3; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); transform: scale(0); transition: transform .3s var(--spring); }
.pick.on .ok { transform: scale(1); }
.pick .ok svg { width: 14px; height: 14px; }
.style-preview, .ap-preview { display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 16px; background: radial-gradient(120% 70% at 0% 0%, var(--bg-2), transparent 60%), var(--bg); border: 1px solid var(--line); box-shadow: var(--shadow); color: var(--fg); }
.amb-aurora.style-preview, .amb-aurora.ap-preview { background: radial-gradient(80% 60% at 20% 10%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%), radial-gradient(70% 60% at 90% 30%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 70%), var(--bg); }
.sp-name { font-size: var(--t-28); line-height: 1.05; }
.sp-favs { display: flex; gap: 8px; }
.sp-cv { position: relative; flex: 1; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 14px -8px var(--shadow-a); }
.amb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.amb-card { display: flex; flex-direction: column; gap: 8px; padding: 8px 8px 8px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; color: var(--fg); transition: transform .2s var(--spring), border-color .2s; }
.amb-card:active { transform: scale(.96); }
.amb-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.ac-sample { position: relative; display: block; height: 64px; border-radius: 12px; background: radial-gradient(120% 80% at 0% 0%, var(--bg-2), transparent 60%), var(--bg); border: 1px solid var(--line); overflow: hidden; }
.amb-aurora .ac-sample { background: radial-gradient(60% 60% at 20% 20%, color-mix(in srgb, var(--accent) 40%, transparent), transparent 70%), radial-gradient(60% 60% at 80% 40%, color-mix(in srgb, var(--accent-2) 40%, transparent), transparent 70%), var(--bg); }
.ac-card { position: absolute; left: 8px; right: 8px; top: 8px; height: 26px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 8px; }
.ac-card i { display: block; height: 4px; border-radius: 999px; background: var(--fg); width: 70%; }
.ac-card i + i { background: var(--muted); width: 45%; }
.ac-dot { position: absolute; left: 8px; right: 30%; bottom: 8px; height: 14px; border-radius: 50%; background: var(--accent); }
.ac-name { font-size: var(--t-13); font-weight: 800; line-height: 1.2; }
.font-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.font-opt { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; min-height: 64px; padding: 8px 16px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; }
.font-opt b { font-size: var(--t-20); line-height: 1.1; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.font-opt span { font-size: var(--t-12); color: var(--muted); font-weight: 700; }
.font-opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.prime { display: grid; place-items: center; height: 210px; position: relative; }
.prime .bell { width: 92px; height: 92px; border-radius: 16px; display: grid; place-items: center; background: var(--grad); color: var(--accent-fg); animation: ring 2.4s ease-in-out infinite; box-shadow: 0 20px 40px -14px var(--accent); }
.prime .bell svg { width: 44px; height: 44px; }
@keyframes ring { 0%, 70%, 100% { transform: rotate(0); } 75% { transform: rotate(-14deg); } 82% { transform: rotate(12deg); } 89% { transform: rotate(-8deg); } 95% { transform: rotate(4deg); } }
.prime .bub { position: absolute; padding: 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-size: var(--t-12); font-weight: 700; box-shadow: var(--shadow); animation: slideUp .6s var(--spring) both; white-space: nowrap; }

/* ---------- inicio ---------- */
.streak-btn { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 12px; border-radius: 999px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--fg); }
.streak-btn:active { background: var(--press); }
.streak-btn small { font-size: var(--t-12); color: var(--muted); font-weight: 700; }
.streak-btn.static { pointer-events: none; min-height: 0; padding: 0; }
.now-rail { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut) 0; }
.now-rail::-webkit-scrollbar { display: none; }
.now { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 72px; flex-shrink: 0; transition: transform .2s var(--spring); }
.now:active { transform: scale(.94); }
.now-av { position: relative; display: inline-grid; }
.now-add { position: absolute; right: -2px; bottom: -2px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 3px var(--bg); }
.now-add svg { width: 13px; height: 13px; }
.now .nm, .note .nm { width: 100%; text-align: center; font-size: var(--t-12); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.week-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; color: var(--fg); }
.week-row:active { background: var(--press); }
.week-row b { display: block; font-size: var(--t-15); }
.week-row .chev, .affinity .chev, .who-has .chev { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.ftabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); margin: 0 calc(-1 * var(--gut)) -10px; }
.ftabs button { text-align: center; min-height: 46px; font-weight: 800; font-size: var(--t-15); color: var(--muted); position: relative; }
.ftabs button[aria-selected="true"] { color: var(--fg); }
.ftabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 3px; border-radius: 999px; background: var(--fg); }
.ftabs-hint { margin: 0; text-align: center; }

/* publicación */
.post { position: relative; display: flex; flex-direction: column; margin: 0 calc(-1 * var(--gut)); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.post-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px var(--gut); }
.ph-av { flex-shrink: 0; display: grid; place-items: center; min-width: 44px; min-height: 44px; }
.ph-who { flex: 1; min-width: 0; min-height: 44px; text-align: left; display: flex; flex-direction: column; justify-content: center; }
.ph-who b { font-size: var(--t-15); line-height: 1.2; }
.ph-meta { display: flex; align-items: center; gap: 4px; font-size: var(--t-13); color: var(--muted); white-space: nowrap; overflow: hidden; }
.life { display: inline-flex; align-items: center; gap: 4px; }
.life svg { display: inline-block; }
.aud { display: inline-flex; margin-left: 4px; color: var(--muted); }
.aud.cf { color: var(--cf); }
.post-media { position: relative; overflow: hidden; background: var(--surface-2); user-select: none; -webkit-user-select: none; }
.pm-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 5; }
.pm-track::-webkit-scrollbar { display: none; }
.pm-slide { flex: 0 0 100%; scroll-snap-align: start; position: relative; }
.pm-slide .scene { position: absolute; inset: 0; }
.pm-count { position: absolute; left: 12px; top: 12px; z-index: 3; padding: 4px 8px; border-radius: 999px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); font-size: var(--t-12); font-weight: 700; pointer-events: none; }
.pm-dots { display: flex; justify-content: center; gap: 4px; padding: 8px 0 0; }
.pm-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .2s, transform .2s; }
.pm-dots i.on { background: var(--accent); transform: scale(1.15); }
/* obras de la publicación: siempre en la esquina superior derecha, un solo botón */
.wstack { position: absolute; top: 8px; right: 8px; z-index: 4; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; max-width: calc(100% - 84px); padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); box-shadow: var(--sh-1); transition: transform .2s var(--spring); }
.wstack:active { transform: scale(.95); }
.ws-covers { display: flex; flex-shrink: 0; }
.ws-cv { position: relative; width: 34px; height: 34px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg) 90%, transparent); }
.ws-cv + .ws-cv { margin-left: -14px; }
.ws-t { font-size: var(--t-13); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spoil .pm-track, .spoil > .obj, .spoil .bgart { filter: blur(26px) saturate(1.2); transform: scale(1.06); }
.spoil .wstack { display: none; }
.spoiler-cover { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 20px; text-align: center; color: var(--fg); background: color-mix(in srgb, var(--bg) 30%, transparent); }
.spoiler-cover .sp-ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); margin-bottom: 8px; }
.spoiler-cover .sp-ico svg { width: 26px; height: 26px; }
.spoiler-cover b { font-size: var(--t-17); }
.spoiler-cover span { font-size: var(--t-13); opacity: .95; max-width: 30ch; }
.spoiler-cover .sp-cta { margin-top: 8px; padding: 8px 16px; border-radius: 999px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); font-weight: 800; }
.obj-media { display: grid; place-items: center; aspect-ratio: 5 / 4; }
.obj-media .bgart { position: absolute; inset: -20%; filter: blur(30px) saturate(1.3); opacity: .8; }
.obj-media > .obj { z-index: 1; }
.post-big { margin: 0; padding: 4px var(--gut) 6px; font-family: var(--f-display); font-variation-settings: "wdth" 90; font-weight: 700; font-size: var(--t-20); line-height: 1.18; letter-spacing: -.01em; overflow-wrap: anywhere; }
.post-actions { display: flex; align-items: center; gap: 0; padding: 2px 8px 0; }
.act { display: inline-flex; align-items: center; gap: 8px; min-width: 44px; min-height: 44px; padding: 0 8px; border-radius: 12px; font-size: var(--t-15); font-weight: 700; color: var(--fg); transition: transform .2s var(--spring); }
.act:active { transform: scale(.88); }
.act svg { width: 25px; height: 25px; flex-shrink: 0; }
.act.liked { color: var(--like); }
.act.liked svg { animation: pop .42s var(--spring); }
.act.saved { color: var(--fg); }
.hide-likes .like-count { display: none; }
.post-cap { margin: 0; padding: 0 var(--gut); font-size: var(--t-15); overflow-wrap: anywhere; }
.post-cap b { font-weight: 800; margin-right: 2px; }
.mention { display: inline; padding: 0; font: inherit; font-weight: 700; color: var(--accent-text); }
.post-more { align-self: flex-start; min-height: 36px; padding: 4px var(--gut); color: var(--muted); font-size: var(--t-15); font-weight: 600; }
.q-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: linear-gradient(150deg, color-mix(in srgb, var(--accent-2) 22%, var(--surface)), var(--surface) 70%); border: 1px solid var(--line); }
.q-card .q { font-family: var(--f-display); font-variation-settings: "wdth" 86; font-size: var(--t-20); font-weight: 800; line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
.q-timer { font-family: var(--f-mono); font-size: var(--t-12); padding: 4px 8px; border-radius: 12px; background: var(--surface-2); color: var(--fg); }
.q-answers { gap: 12px; overflow-x: auto; scrollbar-width: none; }
.stackav.blur > * { filter: blur(3px); }
.people-rail { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut) 4px; scroll-snap-type: x mandatory; scroll-padding-left: var(--gut); }
.people-rail::-webkit-scrollbar { display: none; }
.person-card { width: 168px; flex-shrink: 0; scroll-snap-align: start; border-radius: 16px; padding: 12px; background: radial-gradient(120% 70% at 0% 0%, var(--bg-2), transparent 60%), var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; color: var(--fg); }
.pc-main { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.pc-main b { font-size: var(--t-17); line-height: 1.2; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-minis { display: flex; gap: 4px; margin-top: 4px; }
.caught-up { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 8px 4px; text-align: center; }
.caught-up .tick { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--grad); color: var(--accent-fg); }
.caught-up .tick svg { width: 26px; height: 26px; }
.work-row { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 16px; background: var(--surface-2); text-align: left; width: 100%; color: var(--fg); }
.work-row.tap:active { background: var(--press); }
.work-row b, .pick-row b { display: block; font-size: var(--t-15); line-height: 1.25; }
.work-row .grow span, .pick-row .grow span { display: block; }
.wr-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; min-height: 52px; }
.notif { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 60px; }
.tag-preview { position: relative; aspect-ratio: 4 / 5; max-height: 320px; border-radius: 16px; overflow: hidden; }
.tag-pin { position: absolute; padding: 8px 8px; border-radius: 12px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); font-size: var(--t-13); font-weight: 700; }
.composer-row { display: flex; gap: 8px; align-items: center; }
.composer-row .input { border-radius: 999px; min-height: 46px; }
.send { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); transition: transform .2s var(--spring); }
.send:active { transform: scale(.88); }
.send svg { width: 20px; height: 20px; }
.composer-row.on-dark .input { background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); border-color: var(--on-photo-line); color: var(--fg); }
.composer-row.on-dark .input::placeholder { color: var(--muted); }

/* "Ahora" en pantalla completa */
.story { position: absolute; inset: 0; overflow: hidden; color: var(--fg); }
.story .sbg { position: absolute; inset: -20%; filter: blur(30px) saturate(1.4); }
.story .sdim { position: absolute; inset: 0; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 62%, transparent), color-mix(in srgb, var(--bg) 18%, transparent) 30%, color-mix(in srgb, var(--bg) 72%, transparent)); }
.story .bars { position: absolute; top: calc(var(--safe-top) - 4px); left: 12px; right: 12px; z-index: 3; display: flex; gap: 4px; }
.story .bars i { flex: 1; height: 3px; border-radius: 999px; background: var(--on-photo-line); overflow: hidden; position: relative; }
.story .bars i b { position: absolute; inset: 0; width: 0; background: var(--fg); }
.story .bars i.done b { width: 100%; }
.story .bars i.run b { animation: barRun 5s linear forwards; }
.story.paused .bars i.run b { animation-play-state: paused; }
@keyframes barRun { to { width: 100%; } }
.story .shead { position: absolute; top: calc(var(--safe-top) + 6px); left: 12px; right: 4px; z-index: 4; display: flex; align-items: center; gap: 8px; }
.story .scenter { position: absolute; inset: 128px 20px 168px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; pointer-events: none; }
.story .scenter .obj { pointer-events: auto; }
.story .scenter .t { font-family: var(--f-display); font-variation-settings: "wdth" 82; font-size: var(--t-28); font-weight: 800; line-height: 1; text-wrap: balance; }
.story .s-note { padding: 8px 16px; border-radius: 12px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); font-weight: 600; }
.story .tap { position: absolute; top: calc(var(--safe-top) + 60px); bottom: 168px; z-index: 1; width: 34%; }
.story .tap.l { left: 0; }
.story .tap.r { right: 0; }
.story .sfoot { position: absolute; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 10px); z-index: 4; display: flex; flex-direction: column; gap: 8px; }
.story .reacts { display: flex; justify-content: space-between; }
.story .reacts button { font-size: 1.5rem; width: 52px; height: 52px; border-radius: 50%; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); display: grid; place-items: center; transition: transform .2s var(--spring); }
.story .reacts button:active { transform: scale(.8); }

/* ---------- crear ---------- */
.create .page-head { background: var(--bg); }
.cp-preview { position: relative; aspect-ratio: 4 / 5; max-height: 46vh; margin: 0 auto; width: 100%; background: var(--surface-2); overflow: hidden; display: grid; place-items: center; }
.cp-preview .scene { position: absolute; inset: 0; }
.cp-preview.is-empty { aspect-ratio: auto; height: 190px; }
.cp-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; text-align: center; color: var(--muted); }
.cp-empty svg { width: 40px; height: 40px; color: var(--fg); }
.cp-empty b { color: var(--fg); font-size: var(--t-17); }
.cp-multi { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); font-weight: 800; font-size: var(--t-13); }
.cp-bar { display: flex; align-items: center; gap: 8px; padding: 10px var(--gut); }
.cp-upload { cursor: pointer; }
.cp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.cp-cell { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--surface-2); }
.cp-cell .scene { position: absolute; inset: 0; }
.cp-cell.on::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--bg) 28%, transparent); box-shadow: inset 0 0 0 3px var(--accent); }
.cp-num { position: absolute; top: 8px; right: 8px; z-index: 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: var(--t-12); font-weight: 800; border: 2px solid var(--fg); background: var(--glass-photo); color: var(--fg); }
.cp-cell.on .cp-num { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.create-modes { width: min(340px, calc(100% - 32px)); margin: 2px auto 12px; }
.cp-mini { margin: 0 calc(-1 * var(--gut)); }
.cp-mini .post-media { border-radius: 0; }
.cp-mini .pm-track, .cp-mini .obj-media { aspect-ratio: auto; height: 320px; }
.cp-text-preview { padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); font-family: var(--f-display); font-variation-settings: "wdth" 90; font-weight: 700; font-size: var(--t-20); line-height: 1.2; color: var(--fg); overflow-wrap: anywhere; }
.work-chip { padding-left: 4px; padding-right: 4px; gap: 8px; }
.wc-x { width: 32px; height: 32px; margin: -6px -4px -6px 0; border-radius: 50%; display: grid; place-items: center; color: inherit; }
.wc-x:active { background: var(--press); }
.aud-tile { color: var(--fg); }
.aud-tile.cf { color: var(--cf); }
.sticky-foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; flex-direction: column; gap: 8px; padding: 14px var(--gut) calc(var(--safe-bottom) + 12px); background: linear-gradient(transparent, var(--bg) 28%); }
.create > .sticky-foot { position: sticky; }
.now-pick { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
.hero-obj { display: grid; place-items: center; padding: 16px 0 4px; min-height: 140px; }
.pick-row { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px; border-radius: 16px; background: var(--surface-2); border: 1.5px solid transparent; text-align: left; width: 100%; color: var(--fg); }
.pick-row:active { background: var(--press); }
.pick-row.on { border-color: var(--accent); background: var(--accent-soft); }
.pr-check { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex-shrink: 0; color: var(--fg); }
.pick-row.on .pr-check { background: var(--accent); color: var(--accent-fg); }
.pr-check svg { width: 16px; height: 16px; }

/* =====================================================================
   PANTALLAS (2/2): descubrir, chats, perfil, Bóveda, visor, páginas y ajustes
   ===================================================================== */

/* ---------- descubrir ---------- */
.disc-tile { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 16px; background: radial-gradient(120% 70% at 0% 0%, var(--bg-2), transparent 62%), var(--bg); border: 1px solid var(--line); color: var(--fg); box-shadow: var(--shadow); }
.amb-aurora.disc-tile { background: radial-gradient(80% 60% at 20% 10%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 70%), radial-gradient(70% 60% at 90% 30%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 70%), var(--bg); }
.match-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px; font-size: var(--t-12); font-weight: 800; background: var(--grad); color: var(--accent-fg); }
.dt-av { flex-shrink: 0; min-width: 44px; min-height: 44px; }
.dt-who { display: flex; flex-direction: column; text-align: left; min-height: 44px; justify-content: center; }
.dt-name { font-size: var(--t-20); line-height: 1.1; }
.dt-compat { flex-shrink: 0; min-width: 52px; min-height: 52px; display: grid; place-items: center; }
.dt-bio { margin: 0; font-size: var(--t-15); }
.dt-covers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.dt-cv { position: relative; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 12px -8px var(--shadow-a); }
.cover-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 2px var(--gut) 4px; scroll-snap-type: x mandatory; scroll-padding-left: var(--gut); }
.cover-row::-webkit-scrollbar { display: none; }
.cr-item { width: 108px; flex-shrink: 0; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; text-align: left; }
.cr-item .cv { width: 100%; border-radius: 12px; box-shadow: 0 8px 18px -10px var(--shadow-a); }
.cr-item .cv-album { width: 108px; }
.cr-t { font-size: var(--t-12); font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* ---------- clubes: siguen SISTEMA_DE_DISENO.md (solo variables del ambiente, radios 16/12/999, múltiplos de 4, 200 ms) ---------- */
.club { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 1px 2px color-mix(in srgb, var(--shadow-a) 35%, transparent); transition: border-color .2s var(--ease), box-shadow .2s var(--ease); }

.club-main .xs { display: block; margin-top: 4px; }
.club-mosaic { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: var(--surface-3); }

.new-club { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 16px; border-radius: 16px; border: 1.5px dashed var(--accent-line); background: var(--accent-soft); color: var(--fg); text-align: left; transition: background-color .2s var(--ease), transform .2s var(--ease); }
.new-club b { display: block; font-weight: 700; }
.new-club .small { display: block; }
.new-club .nc-ico { width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center; flex-shrink: 0; background: var(--accent); color: var(--accent-fg); }
.new-club > svg { width: 20px; height: 20px; color: var(--muted); flex-shrink: 0; }
.new-club .nc-ico svg { width: 22px; height: 22px; }
.new-club:active { transform: scale(.98); }
.club-hero { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; padding-top: 8px; }

.club-hero .btn { width: auto; min-width: 200px; }
.club-desc { margin: 0; max-width: 34ch; color: var(--muted); line-height: 1.5; }
.club-overlap { display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.club-overlap .ov-bar { margin-top: 0; }
.club-overlap .ov-bar i { height: 8px; }
.club-works { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 12px; }
.cw { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.cw-cover { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); transition: transform .2s var(--ease); }
.cw-mark { position: absolute; right: 8px; bottom: 8px; z-index: 2; width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); box-shadow: 0 0 0 2px var(--surface); }
.cw-mark svg { width: 14px; height: 14px; }
.cw-t { width: 100%; font-size: var(--t-13); font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.club-composer { display: flex; gap: 8px; align-items: center; margin-top: 8px; }

.club-post:last-child { border-bottom: 0; }
.cp-av { flex-shrink: 0; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; transition: transform .2s var(--ease); }
.cpo-text { margin: 0; line-height: 1.5; }
.cn-body { padding-bottom: 128px; }
.cn-slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.cn-slot { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; border: 1.5px dashed var(--line); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: var(--t-12); font-weight: 700; transition: transform .2s var(--ease); }

.cn-n { position: absolute; left: 4px; top: 4px; z-index: 2; min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; background: var(--accent); color: var(--accent-fg); font-size: var(--t-12); font-weight: 800; }

@media (hover: hover) {

}

/* ---------- chats ---------- */
.notes { display: flex; gap: 16px; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--gut)); padding: 44px var(--gut) 2px; }
.notes::-webkit-scrollbar { display: none; }
.note { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 80px; flex-shrink: 0; }
.note .bubble { position: absolute; bottom: calc(100% - 4px); left: 50%; transform: translateX(-50%); width: max-content; max-width: 80px; padding: 8px 8px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); font-size: var(--t-12); font-weight: 600; line-height: 13px; text-align: center; overflow-wrap: anywhere; z-index: 2; box-shadow: 0 6px 14px -8px var(--shadow-a); color: var(--fg); }
.note .bubble .bt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-height: 26px; }
.note .bubble.empty { color: var(--muted); font-weight: 500; }
.convo { display: flex; align-items: center; gap: 12px; padding: 8px 8px; min-height: 64px; width: 100%; text-align: left; border-radius: 16px; color: var(--fg); }
.convo:active { background: var(--press); }
.convo .grow b { display: block; font-size: var(--t-15); }
.convo .grow span { display: block; font-size: var(--t-13); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo .unread { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.convo.is-unread .grow span { color: var(--fg); font-weight: 700; }
.chat-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; }
.chat-wrap .page-head { position: relative; }
.chat-who { gap: 8px; min-width: 0; text-align: left; min-height: 44px; }
.req-card { margin: 0 16px 8px; padding: 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.chat-scroll { position: relative; flex: 1; overflow-y: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 18px); mask-image: linear-gradient(transparent, #000 18px); } /* color-ok: máscara (solo cuenta la opacidad) */
.chat-scroll::-webkit-scrollbar { display: none; }
.msgs { display: flex; flex-direction: column; gap: 8px; padding: 8px 16px 16px; }
.chat-intro { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 0 16px; text-align: center; }
.msg { max-width: 78%; padding: 8px 12px; border-radius: 16px; font-size: var(--t-15); overflow-wrap: anywhere; position: relative; animation: msgIn .32s var(--spring); }
.msg.them { align-self: flex-start; background: var(--surface-2); color: var(--fg); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-fg); border-bottom-right-radius: 6px; }
.msg .react { position: absolute; bottom: -10px; right: 8px; font-size: var(--t-12); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 4px; }
.msg.them .react { right: auto; left: 8px; }
@keyframes msgIn { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.msg-card { align-self: flex-start; display: flex; gap: 8px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); max-width: 84%; text-align: left; color: var(--fg); animation: msgIn .32s var(--spring); }
.msg-card.me { align-self: flex-end; }
.msg-card small { display: block; font-size: var(--t-12); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seen-mark { align-self: flex-end; font-size: var(--t-12); color: var(--muted); }
.typing-dots { align-self: flex-start; display: inline-flex; gap: 4px; padding: 12px 16px; border-radius: 999px; background: var(--surface-2); }
.typing-dots i { width: 7px; height: 7px; border-radius: 999px; background: var(--muted); animation: dots 1s infinite; }
.typing-dots i:nth-child(2) { animation-delay: .15s; }
.typing-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%, 60%, 100% { transform: none; opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 0 12px 8px; }
.quick::-webkit-scrollbar { display: none; }
.quick button { flex-shrink: 0; min-height: 36px; padding: 8px 12px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--accent-line); font-size: var(--t-13); font-weight: 700; white-space: nowrap; color: var(--fg); }
.chat-composer { padding: 6px 12px calc(var(--safe-bottom) + 8px); }
.blend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bg-cv { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; }
.react-row { display: flex; justify-content: space-between; }
.react-row .icon-btn { width: 52px; height: 52px; font-size: 1.4rem; }
.btn.ice { justify-content: flex-start; text-align: left; min-height: 44px; font-weight: 700; }

/* ---------- perfil (cuadrícula) ---------- */
.p-user { display: flex; align-items: center; gap: 8px; font-family: var(--f-body); font-variation-settings: normal; font-size: var(--t-20); letter-spacing: -.01em; }
.p-head { display: flex; flex-direction: column; gap: 8px; }
.p-top { display: flex; align-items: center; gap: 16px; }
.p-av { position: relative; flex-shrink: 0; border-radius: 50%; }
.p-av .now-add { width: 28px; height: 28px; right: 0; bottom: 0; }
.p-stats { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
.stat { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; color: var(--fg); }
.stat:active { background: var(--press); }
.stat b { font-size: var(--t-17); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat span { font-size: var(--t-12); color: var(--muted); font-weight: 600; }
.p-name { font-size: var(--t-28); line-height: 1.1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.p-sub { font-size: var(--t-13); color: var(--muted); font-weight: 600; margin-top: -6px; }
.p-bio { margin: 0; font-size: var(--t-15); }
.p-sig { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 8px 16px 8px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--fg); align-self: flex-start; max-width: 100%; }
.p-sig b { display: block; font-size: var(--t-15); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-sig .grow span { display: block; font-size: var(--t-12); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.p-sig > svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent-text); }
.sig-disc { position: relative; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 4px var(--page), 0 0 0 5px var(--line); animation: spin 6s linear infinite; }
.sig-disc::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: var(--surface); }
.soft .sig-disc, .rm .sig-disc { animation: none; }
.p-streaks { display: flex; gap: 4px; margin: -4px 0 -4px -8px; }
.p-actions { display: flex; gap: 8px; align-items: center; }
.affinity { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; color: var(--fg); }
.affinity b { display: block; }
.affinity .grow span { display: block; font-size: var(--t-13); color: var(--muted); }
.favs { display: flex; flex-direction: column; gap: 8px; }
.fav-tabs .chip { gap: 8px; }
.fav-shelf { min-height: 150px; gap: 20px; padding-top: 24px; }
.fav-shelf .obj-wrap { position: relative; }
.fav-rank { position: absolute; top: -18px; left: 0; font-family: var(--f-mono); font-size: var(--t-12); font-weight: 500; color: var(--muted); }
.fav-slot { width: 84px; height: 100px; flex-shrink: 0; border-radius: 12px; border: 1.5px dashed color-mix(in srgb, var(--cc) 60%, var(--line)); display: grid; place-items: center; color: var(--cc); align-self: flex-end; margin-bottom: 40px; }
.fav-slot:active { background: color-mix(in srgb, var(--cc) 12%, transparent); }
.fav-slot svg { width: 24px; height: 24px; }
.ptabs { position: sticky; top: calc(var(--safe-top) + 52px); z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); margin: 4px calc(-1 * var(--gut)) 0; background: var(--bg); border-bottom: 1px solid var(--line); }
.profile-page .ptabs { top: calc(var(--safe-top) + 52px); }
.ptabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; font-size: var(--t-12); font-weight: 800; color: var(--muted); position: relative; }
.ptabs button[aria-selected="true"] { color: var(--fg); }
.ptabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2.5px; border-radius: 999px; background: var(--fg); }
.ptab-body { padding-top: 2px; }
.pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 0 calc(-1 * var(--gut)); }
.gtile { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--surface-2); }
.gtile .scene { position: absolute; inset: 0; }
.gtile:active { opacity: .85; }
.gt-ic { position: absolute; top: 4px; right: 4px; z-index: 2; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 999px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); }
.gt-works { position: absolute; left: 8px; bottom: 8px; z-index: 2; display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 12px; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--fg); font-size: var(--t-12); font-weight: 800; }
.gt-works .thumb { box-shadow: 0 0 0 1px var(--on-photo-line); }
.gt-works i { font-style: normal; }
.gt-obj { position: absolute; inset: 0; display: grid; place-items: center; }
.gt-obj .cv { width: 62%; border-radius: 12px; box-shadow: 0 8px 18px -8px var(--shadow-a); }
.gt-obj .cv-album { width: 70%; }
.gt-text { position: absolute; inset: 0; display: grid; place-items: center; padding: 8px; font-family: var(--f-display); font-weight: 800; font-size: var(--t-13); line-height: 1.15; text-align: center; color: var(--fg); background: var(--surface); }
.cat-dot { flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-12); font-weight: 800; color: var(--fg); }
.cat-dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); }

/* Bóveda */
.vault { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.vault-tools { gap: 8px; }
.vgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 8px; }
.vcell { display: flex; flex-direction: column; gap: 4px; text-align: left; min-width: 0; }
.vc-cover { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 16px -10px var(--shadow-a); background: var(--surface-2); }
.vc-fav { position: absolute; top: 4px; right: 4px; z-index: 3; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--glass-photo); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); color: var(--accent-text); }
.vc-t { font-size: var(--t-12); font-weight: 700; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--fg); }
.vc-s { font-size: var(--t-12); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.vc-s::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.vc-s.st-finished::before { background: var(--ok); }
.vc-s.st-in_progress::before { background: var(--accent-2); }
.vc-s.st-wishlist::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }

/* ---------- visor de obra ---------- */
.viewer .vbg { position: absolute; inset: -30% -30% auto; height: 70%; filter: blur(40px) saturate(1.4); opacity: .55; z-index: 0; pointer-events: none; }
.viewer .vbg2 { position: absolute; inset: 0 0 auto; height: 70%; z-index: 0; pointer-events: none; background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 25%, transparent), var(--bg)); }
.viewer .page-head, .viewer .page-body { position: relative; z-index: 1; }
.viewer-body { gap: 16px; }
.stage-box { position: relative; height: 280px; display: grid; place-items: center; }
/* color-ok:inicio · tocadiscos (ilustración) */
.turntable { position: relative; width: 272px; height: 244px; border-radius: 26px; background: linear-gradient(160deg, color-mix(in srgb, var(--surface-3) 80%, #fff 6%), var(--surface)); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .1); }
.turntable .mat { position: absolute; left: 20px; top: 16px; width: 212px; height: 212px; border-radius: 50%; background: #0c0c0e; box-shadow: inset 0 0 0 6px #1b1b20, 0 6px 16px rgba(0, 0, 0, .5); }
.turntable .tt-disc { position: absolute; inset: 8px; border-radius: 50%; background: repeating-radial-gradient(circle at 50% 50%, #0d0d0f 0 1.4px, #202027 1.8px 3.2px); animation: spin 1.8s linear infinite; }
.turntable .tt-disc .label { position: absolute; inset: 31%; border-radius: 50%; overflow: hidden; }
.turntable .tt-disc .hole { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #ccc; }
.turntable .tt-sheen { position: absolute; inset: 8px; border-radius: 50%; background: conic-gradient(from 30deg, transparent 0 9%, rgba(255, 255, 255, .14) 14%, transparent 21% 54%, rgba(255, 255, 255, .09) 61%, transparent 69%); pointer-events: none; }
.turntable .arm { position: absolute; right: 24px; top: 18px; width: 14px; height: 150px; transform-origin: 50% 12px; transform: rotate(-38deg); transition: transform 1s var(--spring); }
.turntable.playing .arm { transform: rotate(-12deg); }
.turntable .arm::before { content: ""; position: absolute; left: -6px; top: 0; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #eee, #888); box-shadow: 0 3px 6px rgba(0, 0, 0, .4); }
.turntable .arm::after { content: ""; position: absolute; left: 5px; top: 18px; width: 4px; height: 128px; border-radius: 2px; background: linear-gradient(90deg, #ddd, #999); }
.turntable .arm i { position: absolute; left: -1px; bottom: -6px; width: 16px; height: 22px; border-radius: 3px; background: #2a2a2e; transform: rotate(20deg); }
/* color-ok:fin */
.turntable:not(.playing) .tt-disc, .turntable:not(.playing) .eq i { animation-play-state: paused; }
.turntable .eq { position: absolute; right: 20px; bottom: 16px; }
.eq { display: flex; gap: 4px; align-items: flex-end; height: 22px; }
.eq i { width: 4px; border-radius: 999px; background: var(--accent); animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .45s; } .eq i:nth-child(4) { animation-delay: .1s; } .eq i:nth-child(5) { animation-delay: .3s; }
@keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }
/* color-ok:inicio · luz del proyector (ilustración) */
.beam { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at 50% 50%, rgba(255, 240, 200, .26), transparent 60%); animation: flicker .14s steps(2) infinite; pointer-events: none; }
/* color-ok:fin */
.rm .beam { animation: none; }
.v-meta { display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; }
.v-title { margin: 0; font-family: var(--f-display); font-variation-settings: "wdth" 82; font-size: var(--t-28); font-weight: 800; line-height: 1; letter-spacing: -.02em; text-wrap: balance; }
.who-has { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; color: var(--fg); min-height: 60px; }
.who-has b { display: block; }

// Bóveda de cada persona: "id" = terminada y favorita según su orden; "id~" = en curso; "id?" = pendiente.
// Las primeras de cada tipo (hasta 5) que no sean pendientes son sus favoritas.
function vaultFrom(list) {
  const out = [];
  const favCount = {};
  list.forEach((code, i) => {
    const status = code.endsWith("~") ? "in_progress" : code.endsWith("?") ? "wishlist" : "finished";
    const id = code.replace(/[~?]$/, "");
    const cat = ITEMS[id].cat;
    let fav = null;
    if (status !== "wishlist" && !code.startsWith("_")) {
      favCount[cat] = (favCount[cat] || 0) + 1;
      if (favCount[cat] <= MAX_FAV) fav = favCount[cat];
    }
    out.push({ id, status, fav, rating: status === "finished" ? 6 + ((i * 7) % 5) : null, added: i });
  });
  return out;
}

let S = makeState();
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEVICE = () => document.getElementById("device");
const motionOff = () => S.settings.reduceMotion || S.settings.anim === "minimal" || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function hash(s) {
  let h = 2166136261;
  for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function haptic(ms = 10) {
  if (S.settings.haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* sin vibración */ } }
}
function clip(text) {
  try { navigator.clipboard?.writeText(text).catch(() => {}); } catch (e) { /* sin portapapeles */ }
}
// "hace 12 min", "hace 3 h", "hace 2 d"
function ago(min) {
  if (min < 1) return "ahora";
  if (min < 60) return `${Math.round(min)} min`;
  if (min < 1440) return `${Math.round(min / 60)} h`;
  return `${Math.round(min / 1440)} d`;
}
const LIFE = { "24h": 1440, "7d": 1440 * 7, "30d": 1440 * 30, forever: null };
const LIFE_LABEL = { "24h": "24 horas", "7d": "7 días", "30d": "30 días", forever: "Siempre" };
function leftOf(p) {
  const total = LIFE[p.life];
  if (!total) return null;
  const left = total - p.age;
  if (left <= 0) return "vencida";
  return left < 60 ? `${Math.round(left)} min` : left < 1440 ? `${Math.round(left / 60)} h` : `${Math.round(left / 1440)} d`;
}

// ---------------------------------------------------------------- color (para "Tuyo" y para revisar contraste)
function hexToRgb(h) {
  const x = h.replace("#", "");
  const n = parseInt(x.length === 3 ? x.split("").map(c => c + c).join("") : x.slice(0, 6), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
const rgbToHex = ([r, g, b]) => "#" + [r, g, b].map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("").toUpperCase();
function luminance(h) {
  const [r, g, b] = hexToRgb(h).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); });
  return .2126 * r + .7152 * g + .0722 * b;
}
function contrast(a, b) {
  const la = luminance(a), lb = luminance(b);
  return (Math.max(la, lb) + .05) / (Math.min(la, lb) + .05);
}
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => v + (B[i] - v) * t)); }
// Acerca un color al blanco o al negro hasta cumplir el contraste pedido
/* color-ok:inicio · motor de ambientes: aquí se calculan los colores */
function ensureContrast(fg, bg, min) {
  let c = fg;
  const toward = luminance(bg) > .4 ? "#000000" : "#FFFFFF";
  for (let i = 0; i < 20 && contrast(c, bg) < min; i++) c = mix(c, toward, .12);
  return c;
}
// Genera un ambiente completo a partir de dos colores
function customTokens(bg, accent) {
  const dark = luminance(bg) < .3;
  const base = dark ? "#FFFFFF" : "#000000";
  const fg = dark ? mix(bg, "#FFFFFF", .94) : mix(bg, "#000000", .9);
  const acc = accent;
  const accentFg = contrast("#FFFFFF", acc) >= contrast("#111111", acc) ? "#FFFFFF" : "#111111";
  const ref = dark ? PALETTES.medianoche.t : PALETTES.arcilla.t;
  return {
    page: mix(bg, "#000000", dark ? .45 : .08), bg, bg2: mix(bg, acc, .22),
    surface: mix(bg, base, .06), surface2: mix(bg, base, .1), surface3: mix(bg, base, .16), line: mix(bg, base, .18),
    fg: ensureContrast(fg, bg, 12), muted: ensureContrast(mix(fg, bg, .3), mix(bg, base, .1), 5.2), faint: ensureContrast(mix(fg, bg, .42), mix(bg, base, .1), 4.6),
    accent: acc, accent2: ref.accent2, accentFg, grad: `linear-gradient(135deg, ${mix(acc, "#FFFFFF", .25)}, ${acc})`,
    ...Object.fromEntries(["album", "movie", "book", "game", "tv"].map(k => [k, ensureContrast(ref[k], mix(bg, base, .1), 4.5)])),
    shadow: dark ? "rgba(0,0,0,.45)" : "rgba(0,0,0,.14)",
    _mode: dark ? "dark" : "light",
  };
}
function tokensOf(id, custom) {
  if (id === "tuyo") return customTokens((custom || S.me.custom).bg, (custom || S.me.custom).accent);
  return (PALETTES[id] || PALETTES.arcilla).t;
}
function modeOf(id, custom) { return id === "tuyo" ? tokensOf(id, custom)._mode : (PALETTES[id] || PALETTES.arcilla).mode; }

// Una clase .amb-<id> por ambiente: se puede aplicar a toda la app o solo a un perfil
function tokenCSS(id, t, mode) {
  const vars = Object.entries(t).filter(([k]) => !k.startsWith("_")).map(([k, v]) => {
    const name = { bg2: "bg-2", surface2: "surface-2", surface3: "surface-3", accent2: "accent-2", accentFg: "accent-fg", album: "c-album", movie: "c-movie", book: "c-book", game: "c-game", tv: "c-tv", shadow: "shadow-a" }[k] || k;
    return `--${name}:${v}`;
  }).join(";");
  // Colores de texto que siempre se leen bien sobre el fondo y las tarjetas de ese ambiente
  const okOn = (c, min = 4.6) => ensureContrast(ensureContrast(c, t.bg, min), t.surface, min);
  const dark = mode === "dark";
  const extra = `--accent-text:${okOn(t.accent)};--danger:${okOn(dark ? "#FF6B6B" : "#C62828")};--ok:${okOn(dark ? "#4ADE80" : "#15803D")};--like:${okOn(dark ? "#FF4D6D" : "#E11D48", 3.2)}`;
  return `.amb-${id}{${vars};${extra};color-scheme:${mode}}`;
}
/* color-ok:fin */
function buildThemeCSS() {
  let css = PALETTE_ORDER.filter(id => id !== "tuyo").map(id => tokenCSS(id, PALETTES[id].t, PALETTES[id].mode)).join("\n");
  css += "\n" + tokenCSS("tuyo", customTokens(S.me.custom.bg, S.me.custom.accent), modeOf("tuyo"));
  Object.values(USERS).forEach(u => { if (u.custom) css += "\n" + tokenCSS("tuyo-" + u.name.toLowerCase(), customTokens(u.custom.bg, u.custom.accent), "dark"); });
  let el = document.getElementById("theme-css");
  if (!el) { el = document.createElement("style"); el.id = "theme-css"; document.head.appendChild(el); }
  el.textContent = css;
}

// ¿Qué ambiente usa la app ahora? Antes de entrar: el del sistema. Después: el de tu perfil
// (o el del sistema si así lo pediste en Apariencia).
// Respeta el tema que la persona eligió en el visor (data-theme en <html>) y, si no eligió, el del sistema.
const systemDark = () => {
  const t = document.documentElement.getAttribute("data-theme");
  return t === "dark" || t === "light" ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
};
function appTheme() {
  if (S.screen !== "app") return S.previewTheme || (systemDark() ? "medianoche" : "arcilla");
  if (S.settings.theme === "auto") return systemDark() ? "medianoche" : "arcilla";
  return S.me.theme;
}
function applyTheme() {
  const id = appTheme();
  const root = document.documentElement;
  PALETTE_ORDER.forEach(p => root.classList.remove("amb-" + p));
  root.classList.add("amb-" + id);
  root.dataset.mode = modeOf(id);
  root.dataset.amb = id;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = tokensOf(id).bg;
  $$("#guide-swatches button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.theme === S.me.theme)));
}
// Cambio animado (círculo que se expande desde donde tocaste)
function setTheme(id, x, y) {
  const apply = () => { S.me.theme = id; S.settings.theme = "profile"; applyTheme(); saveSettings(); };
  if (document.startViewTransition && !motionOff()) {
    const t = document.startViewTransition(apply);
    const w = window.innerWidth, h = window.innerHeight;
    const cx = x ?? w / 2, cy = y ?? h / 2;
    const r = Math.hypot(Math.max(cx, w - cx), Math.max(cy, h - cy));
    t.ready.then(() => {
      document.documentElement.animate({ clipPath: [`circle(0px at ${cx}px ${cy}px)`, `circle(${r}px at ${cx}px ${cy}px)`] },
        { duration: 600, easing: "cubic-bezier(.2,.8,.2,1)", pseudoElement: "::view-transition-new(root)" });
    }).catch(() => {});
  } else apply();
  haptic(12);
}
function applyA11y() {
  const s = S.settings, root = document.documentElement;
  root.classList.toggle("rm", s.reduceMotion || s.anim === "minimal");
  root.classList.toggle("soft", s.anim === "soft");
  root.classList.toggle("hc", s.highContrast);
  root.classList.toggle("cb", s.colorBlind);
  root.classList.toggle("show-alt", s.altText);
  root.classList.toggle("hide-likes", s.hideLikes);
  root.style.fontSize = (16 * s.textScale) + "px";
}

// Solo preferencias de este navegador (en la app real viven en tu cuenta)
const SAVE_KEYS = ["theme", "anim", "textScale", "reduceMotion", "highContrast", "colorBlind", "altText", "haptics"];
function saveSettings() {
  try {
    const o = { meTheme: S.me.theme, custom: S.me.custom, font: S.me.font };
    SAVE_KEYS.forEach(k => (o[k] = S.settings[k]));
    localStorage.setItem("boveda-v3-ajustes", JSON.stringify(o));
  } catch (e) { /* almacenamiento no disponible */ }
}
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem("boveda-v3-ajustes") || "null");
    if (!o) return;
    SAVE_KEYS.forEach(k => { if (k in o) S.settings[k] = o[k]; });
    if (o.meTheme && PALETTES[o.meTheme]) S.me.theme = o.meTheme;
    if (o.custom?.bg && o.custom?.accent) S.me.custom = o.custom;
    if (o.font && NAME_FONTS[o.font]) S.me.font = o.font;
  } catch (e) { /* almacenamiento no disponible */ }
}

// Generador determinista: la misma obra siempre tiene la misma portada
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
}
const LAYOUTS = { album: 6, movie: 4, book: 4, game: 4, tv: 3 };
function coverColors(id) {
  const it = ITEMS[id];
  const h = hash(it.title + "|" + it.creator);
  const hue = h % 360, scheme = (h >>> 8) % 5;
  const H = d => (hue + d + 360) % 360;
  switch (scheme) {
    case 0: return { c1: `hsl(${hue} 62% 30%)`, c2: `hsl(${H(40)} 82% 62%)`, c3: `hsl(${H(-30)} 70% 14%)`, c4: `hsl(${H(10)} 40% 90%)`, ink: "#fff", dark: true };
    case 1: return { c1: `hsl(${hue} 72% 86%)`, c2: `hsl(${H(150)} 58% 42%)`, c3: `hsl(${H(30)} 52% 30%)`, c4: `hsl(${H(-20)} 60% 96%)`, ink: `hsl(${hue} 60% 12%)`, dark: false };
    case 2: return { c1: `hsl(${hue} 78% 46%)`, c2: `hsl(${H(180)} 88% 62%)`, c3: `hsl(${H(30)} 80% 16%)`, c4: `hsl(${H(60)} 90% 92%)`, ink: "#fff", dark: true };
    case 3: return { c1: `hsl(${hue} 18% 11%)`, c2: `hsl(${hue} 82% 60%)`, c3: `hsl(${hue} 22% 26%)`, c4: `hsl(${hue} 30% 88%)`, ink: "#fff", dark: true };
    default: return { c1: `hsl(${hue} 32% 91%)`, c2: `hsl(${hue} 70% 40%)`, c3: `hsl(${H(200)} 52% 28%)`, c4: `hsl(${H(20)} 50% 97%)`, ink: `hsl(${hue} 40% 12%)`, dark: false };
  }
}
const altFor = id => { const it = ITEMS[id]; return `Portada ilustrada de ${it.title}, de ${it.creator}`; };

// Portada: o.bare = solo el fondo (sin textos); o.fill = llena su contenedor
function cover(id, o = {}) {
  const it = ITEMS[id], cat = it.cat, col = coverColors(id);

  const style = `--c1:${col.c1};--c2:${col.c2};--c3:${col.c3};--c4:${col.c4};--ink:${col.ink}`;
  const t = esc(it.title), a = esc(it.creator);
