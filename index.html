let NOISE = "";
function makeNoise() {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 96;
    const x = c.getContext("2d"), img = x.createImageData(96, 96);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    NOISE = c.toDataURL();
  } catch (e) { NOISE = ""; }
}
const OBJ_W = { vinyl: 1.32, book: .76, film: .86, tv: 1.16, cart: .92 };
const objWidth = (id, s) => Math.round(s * OBJ_W[CAT[ITEMS[id].cat].obj]);

function obj(id, s = 100, o = {}) {
  const it = ITEMS[id], c = CAT[it.cat];
  const act = o.act === false ? "" : `data-act="${o.act || "obj"}" data-id="${id}" ${o.owner ? `data-owner="${o.owner}"` : ""} role="button" tabindex="0"`;
  const label = o.act === false ? 'aria-hidden="true"' : `aria-label="${esc(c.one + ": " + it.title + ", " + it.creator)}"`;
  const head = `<div class="obj ${c.obj} ${o.cls || ""}" style="--s:${s}px" ${act} ${label}><span class="obj-tag" aria-hidden="true">${c.letter}</span>`;
  switch (c.obj) {
    case "vinyl":
      return `${head}<div class="platter"><div class="disc"><div class="label">${cover(id, { bare: true, fill: true })}</div><div class="hole"></div></div><div class="sheen"></div></div><div class="sleeve">${cover(id, { fill: true })}</div></div>`;
    case "book":
      return `${head}<div class="b-inside"><span class="b-mini">${cover(id, { bare: true, fill: true })}</span><b>${esc(it.title)}</b><small>${esc(it.creator)}</small></div><div class="leaf l3"></div><div class="leaf l2"></div><div class="leaf l1"></div><div class="cover"><div class="cv-front">${cover(id, { fill: true })}</div><div class="cv-back">${s >= 90 ? `<span class="exlibris"><i>✦</i>Ex libris${o.owner ? `<b>@${esc(o.owner)}</b>` : ""}</span>` : ""}</div></div></div>`;
    case "film": {
      const fr = `<div class="frame">${cover(id, { fill: true })}</div>`;
      return `${head}<div class="holes l"></div><div class="holes r"></div><div class="window"><div class="reel">${fr}${fr}${fr}</div></div><div class="flick"></div><span class="badge-fps">24 FPS</span></div>`;
    }
    case "tv":
      return `${head}<div class="ant"><i></i><i></i></div><div class="body"><div class="screen">${cover(id, { fill: true })}<div class="noise" style="background-image:url(${NOISE})"></div><div class="scan"></div><div class="glass"></div></div><div class="panel"><b class="knob"></b><b class="knob"></b><span class="grill"></span></div></div><div class="feet"><i></i><i></i></div></div>`;
    default:
      return `${head}<div class="shell"><div class="grip"></div><div class="lbl">${cover(id, { fill: true })}</div><div class="pins"></div></div><span class="start">PRESS START</span></div>`;
  }
}
// La animación propia de cada objeto. Devuelve cuánto tarda en lucirse.
function playObj(el) {
  if (!el) return 0;
  const k = ["vinyl", "book", "film", "tv", "cart"].find(x => el.classList.contains(x));
  haptic(14);
  switch (k) {
    case "vinyl": el.classList.add("playing"); return 650;
    case "book": el.classList.add("open"); return 950;
    case "film": el.classList.add("playing"); setTimeout(() => el.classList.remove("playing"), 1600); return 600;
    case "tv": el.classList.remove("on"); void el.offsetWidth; el.classList.add("on"); return 800;
    case "cart": el.classList.remove("playing"); void el.offsetWidth; el.classList.add("playing"); pixelBurst(el); setTimeout(() => el.classList.remove("playing"), 1700); return 650;
  }
  return 0;
}
function resetObj(el) { if (el) el.classList.remove("playing", "open", "on"); }
function pixelBurst(el) {
  if (motionOff()) return;
  const colors = ["--accent", "--accent-2", "--c-game", "--c-album"].map(v => getComputedStyle(el).getPropertyValue(v).trim());
  for (let i = 0; i < 14; i++) {
    const p = document.createElement("i");
    p.className = "pixel";
    const ang = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    p.style.cssText = `left:50%;top:40%;background:${colors[i % colors.length]};--dx:${Math.cos(ang) * d}px;--dy:${Math.sin(ang) * d - 20}px`;
    el.appendChild(p);
    setTimeout(() => p.remove(), 750);
  }
}

function catCounts(ids) { return CATS.map(c => ids.filter(id => ITEMS[id].cat === c.id).length); }
// Compatibilidad: 68% obras en común + 32% parecido en los tipos (igual que la base de datos)
function compat(ua, ub) {
  const a = livedIds(ua), b = livedIds(ub);
  if (!a.length || !b.length) return { shared: 0, items: [], pct: 0, byCat: {} };
  const items = a.filter(x => b.includes(x));
  const itemSim = (2 * items.length) / (a.length + b.length);
  const ca = catCounts(a), cb = catCounts(b);
  const dot = ca.reduce((s, x, i) => s + x * cb[i], 0);
  const norm = v => Math.sqrt(v.reduce((s, x) => s + x * x, 0)) || 1;
  const byCat = {};
  CATS.forEach(c => {
    const mine = a.filter(id => ITEMS[id].cat === c.id), theirs = b.filter(id => ITEMS[id].cat === c.id);
    const sh = mine.filter(x => theirs.includes(x)).length;
    byCat[c.id] = Math.min(99, mine.length && theirs.length ? 30 + Math.round(70 * (2 * sh) / (mine.length + theirs.length)) : (mine.length || theirs.length ? 12 : 0));
  });
  return { shared: items.length, items, pct: Math.min(99, Math.round(100 * (0.68 * itemSim + 0.32 * (dot / (norm(ca) * norm(cb)))))), byCat };
}
function archetypeOf(u) {
  const c = catCounts(livedIds(u));
  if (!c.some(Boolean)) return ARCHETYPES.omni;
  const max = Math.max(...c), min = Math.min(...c);
  if (min >= 1 && max - min <= 2) return ARCHETYPES.omni;
  return ARCHETYPES[CATS[c.indexOf(max)].id];
}

// ---------------------------------------------------------------- anillos de la semana y compatibilidad
function ringsSVG(week, size = 96, o = {}) {
  const stroke = size * .068, gap = size * .02, cx = size / 2;
  const label = CATS.map(c => `${c.name} ${week[c.id] ? "cerrado" : "abierto"}`).join(", ");
  let out = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Anillos de la semana: ${label}">`;
  CATS.forEach((c, i) => {
    const r = cx - stroke / 2 - i * (stroke + gap), C = 2 * Math.PI * r, v = week[c.id] ? 1 : 0, off = C * (1 - v);
    out += `<circle cx="${cx}" cy="${cx}" r="${r.toFixed(2)}" fill="none" stroke="var(--c-${c.id})" stroke-opacity=".22" stroke-width="${stroke.toFixed(2)}"/>`;
    out += `<circle class="rg" data-off="${off.toFixed(2)}" cx="${cx}" cy="${cx}" r="${r.toFixed(2)}" fill="none" stroke="var(--c-${c.id})" stroke-width="${stroke.toFixed(2)}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(o.animate ? C : off).toFixed(2)}" transform="rotate(-90 ${cx} ${cx})"/>`;
    out += `<text class="lbl" x="${cx}" y="${(cx - r + stroke * .34).toFixed(2)}" text-anchor="middle" style="font-size:${(stroke * .95).toFixed(1)}px">${c.letter}</text>`;
  });
  return `<span class="rings">${out}</svg></span>`;
}
function animateRings(root = document) {
  requestAnimationFrame(() => requestAnimationFrame(() => $$(".rg[data-off]", root).forEach(c => c.setAttribute("stroke-dashoffset", c.dataset.off))));
}
function compatRing(pct, size = 64, o = {}) {
  const sw = o.sw || Math.max(5, size * .09), r = size / 2 - sw / 2, C = 2 * Math.PI * r;
  return `<span class="compat-ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle class="rg" data-off="${(C * (1 - pct / 100)).toFixed(2)}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg><span class="num" data-count="${pct}" style="font-size:${o.fs || size * .28}px">${o.static ? pct : 0}%</span></span>`;
}
function runCounters(root = document) {
  $$("[data-count]", root).forEach(el => {
    const to = Number(el.dataset.count);
    el.removeAttribute("data-count");
    if (motionOff()) { el.textContent = to + "%"; return; }
    const t0 = performance.now(), dur = 1000;
    const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + "%"; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

const LAYERS = {};
const STACK = [];
const topLayer = () => STACK[STACK.length - 1];

function openLayer(type, props = {}) {
  const def = LAYERS[type];
  const host = $("#layers");
  const el = document.createElement("div");
  el.className = `layer ${def.kind}`;
  el.dataset.type = type;
  const amb = def.theme?.(props);
  if (amb) el.classList.add("amb-" + amb, "themed");
  el.innerHTML = layerShell(def, def.build(props));
  host.appendChild(el);
  const entry = { type, props, el, from: document.activeElement };
  STACK.push(entry);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("in")));
  def.after?.(el, props, entry);
  setTimeout(() => { const f = $("[autofocus]", el) || $(".layer-focus", el); f?.focus({ preventScroll: true }); }, 60);
  haptic(8);
  return entry;
}
function layerShell(def, inner) {
  if (def.kind === "sheet") return `<div class="sheet-card" role="dialog" aria-modal="true" aria-label="${esc(def.label || "Opciones")}"><div class="grab" aria-hidden="true"></div><div class="sheet-body">${inner}</div></div>`;
  if (def.kind === "modal") return `<div class="modal-card" role="dialog" aria-modal="true">${inner}</div>`;
  return inner;
}
function closeLayer() {
  const entry = STACK.pop();
  if (!entry) return;
  LAYERS[entry.type].onClose?.(entry);
  entry.el.classList.remove("in");
  entry.el.classList.add("out");
  setTimeout(() => entry.el.remove(), 360);
  try { entry.from?.focus?.({ preventScroll: true }); } catch (e) { /* sin foco */ }
}
function closeAllLayers() { while (STACK.length) closeLayer(); }
function refreshLayer(entry = topLayer()) {
  if (!entry) return;
  const def = LAYERS[entry.type];
  const keep = $$(".scroll, .sheet-body", entry.el).map(s => s.scrollTop);
  if (def.kind === "sheet") $(".sheet-body", entry.el).innerHTML = def.build(entry.props);
  else if (def.kind === "modal") $(".modal-card", entry.el).innerHTML = def.build(entry.props);
  else entry.el.innerHTML = def.build(entry.props);
  $$(".scroll, .sheet-body", entry.el).forEach((s, i) => { if (keep[i]) s.scrollTop = keep[i]; });
  def.after?.(entry.el, entry.props, entry, true);
}
const refreshLayersOfType = type => STACK.filter(e => e.type === type).forEach(e => refreshLayer(e));

function confetti(n = 70) {

function shuffled(ids, seed) {
  const R = rng(seed), a = ids.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

    const items = ids.map(id => `<span class="wcell" style="height:${h}px">${cover(id)}</span>`).join("");
    return `<div class="wrow ${r % 2 ? "rev" : ""}" style="--dur:${dur}s"><div class="wtrack">${items}${items}</div></div>`;
  }).join("")}</div></div>`;

function audienceIcon(a) {

  if (a === "close_friends") return `<span class="aud cf" title="Mejores amigos" aria-label="Solo mejores amigos">${icon("closeFriends", 14)}</span>`;

}
function linkify(text) {
  return esc(text).replace(/(^|[^\w@])@([a-z0-9_]{3,20})/gi, (m, pre, u) => `${pre}<button class="mention" type="button" data-act="user" data-id="${u.toLowerCase()}">@${u}</button>`);
}
// ¿Se oculta por spoilers? Según tu ajuste: obras que no has terminado, siempre o nunca
function hidesSpoiler(p) {
  if (!p.spoilers || p.revealed || p.user === S.me.username) return false;
  const mode = S.settings.spoilerMode;
  if (mode === "never") return false;
  if (mode === "always") return true;
  return p.items.some(id => vEntry(S.me.username, id)?.status !== "finished");
}
function worksStack(p) {
  if (!p.items.length) return "";
  const n = p.items.length;
  const label = `Obras en esta publicación: ${p.items.map(id => ITEMS[id].title).join(", ")}`;
  const covers = p.items.slice(0, 3).map(id => `<span class="ws-cv">${cover(id, { fill: true, bare: true })}</span>`).join("");
  const text = n === 1 ? `<span class="ws-t">${esc(ITEMS[p.items[0]].title)}</span>` : `<span class="ws-t">${n} obras</span>`;
  return `<button class="wstack" type="button" data-act="post-works" data-id="${p.id}" aria-label="${esc(label)}"><span class="ws-covers">${covers}</span>${text}</button>`;
}
function postMedia(p) {
  const spoil = hidesSpoiler(p);
  if (p.photos.length) {
    const slides = p.photos.map((ph, i) => `<div class="pm-slide" aria-label="Foto ${i + 1} de ${p.photos.length}">${photo(ph)}</div>`).join("");
    return `<div class="post-media ${spoil ? "spoil" : ""}" data-dbl="${p.id}">
      <div class="pm-track" data-carousel="${p.id}">${slides}</div>
      ${worksStack(p)}
      ${spoil ? spoilerCover(p) : ""}
      ${p.photos.length > 1 ? `<span class="pm-count" aria-hidden="true"><span data-count-of="${p.id}">1</span>/${p.photos.length}</span>` : ""}
    </div>${p.photos.length > 1 ? `<div class="pm-dots" aria-hidden="true">${p.photos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}`;
  }
  if (p.items.length) {
    const id = p.items[0];
    return `<div class="post-media obj-media ${spoil ? "spoil" : ""}" data-dbl="${p.id}"><div class="bgart" style="background:${coverBg(id)}"></div>${obj(id, 124, { owner: p.user })}${p.items.length > 1 ? worksStack({ ...p, items: p.items }) : ""}${spoil ? spoilerCover(p) : ""}</div>`;
  }
  return "";
}
function spoilerCover(p) {
  return `<button class="spoiler-cover" type="button" data-act="reveal" data-id="${p.id}"><span class="sp-ico">${ICON.eyeOff}</span><b>Contiene spoilers</b><span>${esc(p.items.map(id => ITEMS[id].title).join(", "))}</span><span class="sp-cta">Toca para ver</span></button>`;
}

    ${comments && !p.noComments ? `<button class="post-more" data-act="comments" data-id="${p.id}" type="button">${comments === 1 ? "Ver 1 comentario" : `Ver los ${comments} comentarios`}</button>` : ""}
  </article>`;
}
// Carrusel de fotos: puntos y contador siguen al deslizar
function bindCarousels(root) {
  $$("[data-carousel]", root).forEach(tr => {
    if (tr.dataset.bound) return;
    tr.dataset.bound = "1";
    tr.addEventListener("scroll", () => {
      const i = Math.round(tr.scrollLeft / tr.clientWidth);
      const post = tr.closest(".post");
      $$(".pm-dots i", post).forEach((d, k) => d.classList.toggle("on", k === i));
      const c = $(`[data-count-of="${tr.dataset.carousel}"]`, post);
      if (c) c.textContent = i + 1;
    }, { passive: true });
  });
}

      <div class="scenter"><span class="eyebrow">${esc(verb)}</span>${obj(id, 168, { act: "obj-open-story" })}<div class="t">${esc(it.title)}</div><span style="opacity:.9">${esc(it.creator)} · ${it.year}</span>${mo[3] ? `<span class="s-note">“${esc(mo[3])}”</span>` : ""}</div>
      <div class="sfoot">

        : `<div class="reacts">${["🔥", "😍", "🤯", "🙌", "😭"].map(e => `<button data-act="story-react" data-e="${e}" type="button" aria-label="Reaccionar con ${e}">${e}</button>`).join("")}</div>
           <form class="composer-row on-dark" id="f-story"><input id="story-input" class="input" placeholder="Responde a ${esc(name)}…" autocomplete="off" aria-label="Responder"><button class="send" type="submit" aria-label="Enviar">${ICON.send}</button></form>`}
      </div>
    </div>`;
  },
  after(el, props, entry) { storyStart(entry); },
  onClose() { clearTimeout(storyTimer); STORY_PAUSED = false; },
};
function storyStart(entry) {
  clearTimeout(storyTimer);
  const { list, idx } = entry.props;
  if (!isMe(list[idx])) S.seenMoments.add(list[idx]);
  const o = $(".scenter .obj", entry.el);
  if (o) setTimeout(() => playObj(o), 250);
  if (!STORY_PAUSED) storyTimer = setTimeout(() => storyMove(entry, 1), 5000);
}
function storyMove(entry, d) {
  if (topLayer() !== entry) return;
  const ni = entry.props.idx + d;
  if (ni < 0) { entry.props.idx = 0; refreshLayer(entry); return; }
  if (ni >= entry.props.list.length) { closeLayer(); refresh(); return; }
  entry.props.idx = ni;
  refreshLayer(entry);
}
function storyPause(on) {
  const entry = topLayer();
  if (!entry || entry.type !== "story") return;
  STORY_PAUSED = on;
  $(".story", entry.el)?.classList.toggle("paused", on);
  clearTimeout(storyTimer);
  if (!on) storyTimer = setTimeout(() => storyMove(entry, 1), 3000);
}

function catalogSearch(cat, q) {
  const qs = (q || "").trim().toLowerCase();
  const pool = (cat === "all" ? ALL_IDS : idsOf(cat)).filter(id => !qs || (ITEMS[id].title + " " + ITEMS[id].creator).toLowerCase().includes(qs));
  const mine = new Set(vaultOf(S.me.username).map(v => v.id));
  return pool.sort((a, b) => (mine.has(b) ? 1 : 0) - (mine.has(a) ? 1 : 0));
}
function pickRows(list, act, chosen = []) {
  if (!list.length) return `<p class="muted small center" style="margin:12px 0">Sin resultados. Prueba con otro título.</p>`;

    const it = ITEMS[id], on = chosen.includes(id), mine = vEntry(S.me.username, id);

  }).join("");
}

function discPeople() {
  const q = (S.discQ || "").trim().toLowerCase();
  let list = Object.keys(USERS).filter(u => !S.blocked.has(u)).map(u => ({ u, ...compat(S.me.username, u) }));
  if (q) list = list.filter(x => (USERS[x.u].name + " " + x.u).toLowerCase().includes(q));
  const f = S.discFilter;
  if (f === "cerca") list = list.filter(x => USERS[x.u].city === S.me.city);
  else if (f !== "todos") list = list.filter(x => vaultOf(x.u).some(v => ITEMS[v.id].cat === f));
  return list.sort((a, b) => b.pct - a.pct);
}

// Tarjeta de persona: se pinta con SU ambiente y SU letra
function discTile(x, featured) {
  const u = USERS[x.u], following = S.me.following.has(x.u);
  const show = x.shared ? x.items : livedIds(x.u).filter(id => !vEntry(S.me.username, id)).slice(0, 5);

      <button class="grow dt-who" data-act="user" data-id="${x.u}" type="button"><span class="dt-name">${nameHTML(x.u)}</span><span class="small muted">@${esc(x.u)} · ${esc(u.city)}</span></button>
      <button class="dt-compat" data-act="compat" data-id="${x.u}" type="button" aria-label="Por qué son ${x.pct}% afines">${compatRing(x.pct, 52, { fs: 14 })}</button>

    <span class="xs muted">${x.shared ? `Tienen ${plural(x.shared, "obra", "obras")} en común` : `Para descubrir: ${show.length} obras que no tienes`}</span>
    <div class="row">
      <button class="btn sm ${following ? "ghost" : ""} grow" data-act="follow" data-id="${x.u}" type="button">${following ? "Siguiendo" : "Seguir"}</button>
      <button class="btn sm ghost grow" data-act="chat" data-id="${x.u}" type="button">Mensaje</button>
    </div>
  </article>`;
}
// ---------------------------------------------------------------- clubes
// Un club reúne de 3 a 10 obras que se parecen. Cualquiera se une aunque no las tenga todas.
const clubById = id => CLUBS.find(c => c.id === id);
const isClubMember = c => c.owner === S.me.username || S.clubs.has(c.id);
const clubCount = c => c.count + (S.clubs.has(c.id) && c.owner !== S.me.username ? 1 : 0);
// Rol en el club: el dueño edita todo; los admins aceptan solicitudes, sacan miembros y quitan publicaciones
const clubRole = (c, u = S.me.username) => c.owner === u ? "owner" : (c.admins || []).includes(u) ? "admin" : null;
const clubAdmin = c => !!clubRole(c);
// Cuántas obras del club tienes (vividas), cuántas guardaste en Quiero y cuáles te faltan
function clubOverlap(c) {
  const o = { have: [], want: [], missing: [] };
  c.works.forEach(id => { const e = vEntry(S.me.username, id); (e ? (e.status === "wishlist" ? o.want : o.have) : o.missing).push(id); });
  return o;
}
// Portada sin subir imágenes: mosaico con las primeras 4 portadas del club
const clubMosaic = (c, cls = "") => `<span class="club-mosaic ${cls}" aria-hidden="true">${c.works.slice(0, 4).map(id => `<span>${cover(id, { fill: true, bare: true })}</span>`).join("")}</span>`;
// Un segmento por obra: lleno = la tienes, tenue = está en tu Quiero
const overlapBar = (c, o) => `<span class="ov-bar" aria-hidden="true">${c.works.map(id => `<i class="${o.have.includes(id) ? "on" : o.want.includes(id) ? "want" : ""}"></i>`).join("")}</span>`;
function clubJoinBtn(c, cls = "sm") {
  if (c.owner === S.me.username) return `<button class="btn ${cls} ghost" data-act="club-edit" data-id="${c.id}" type="button">Editar club</button>`;
  const member = S.clubs.has(c.id), pending = S.clubPending.has(c.id);
  const label = member ? "Dentro" : pending ? "Solicitado" : c.join === "request" ? "Solicitar" : "Unirme";
  return `<button class="btn ${cls} ${member || pending ? "ghost" : ""}" data-act="join-club" data-id="${c.id}" type="button" aria-pressed="${member || pending}">${label}</button>`;
}
function clubRow(c) {
  const o = clubOverlap(c);
  return `<div class="club">
    <button class="club-main" data-act="club" data-id="${c.id}" type="button">${clubMosaic(c)}
      <span class="grow"><b class="ellipsis">${esc(c.name)}</b><span class="xs muted">${plural(clubCount(c), "miembro", "miembros")} · Tienes ${o.have.length} de ${c.works.length}</span>${overlapBar(c, o)}</span>
    </button>
    ${clubJoinBtn(c)}
  </div>`;
}
function clubsBody() {
  const q = (S.discQ || "").trim().toLowerCase();
  const list = CLUBS.filter(c => !q || c.name.toLowerCase().includes(q) || c.works.some(id => ITEMS[id].title.toLowerCase().includes(q)));
  const mine = list.filter(isClubMember);
  // Para ti: los que más se parecen a tu Bóveda. Populares: el resto, con más miembros primero (sin repetir).
  const forYou = list.filter(c => !isClubMember(c)).map(c => ({ c, n: clubOverlap(c).have.length / c.works.length }))
    .filter(x => x.n > 0).sort((a, b) => b.n - a.n || clubCount(b.c) - clubCount(a.c)).slice(0, 4).map(x => x.c);
  const popular = list.filter(c => !isClubMember(c) && !forYou.includes(c)).sort((a, b) => clubCount(b) - clubCount(a));
  return `<button class="new-club" data-act="club-new" type="button"><span class="nc-ico">${ICON.plus}</span><span class="grow"><b>Crear un club</b><span class="small muted">Junta de ${CLUB_MIN} a ${CLUB_MAX} obras que se parecen</span></span>${ICON.chev}</button>
    ${mine.length ? `<section class="col" style="gap:8px"><b class="h3">Tus clubes</b>${mine.map(clubRow).join("")}</section>` : ""}
    ${forYou.length ? `<section class="col" style="gap:8px"><b class="h3">Para ti</b><span class="xs muted">Primero los que más se parecen a tu Bóveda. Te puedes unir aunque no tengas todas sus obras.</span>${forYou.map(clubRow).join("")}</section>` : ""}
    ${popular.length ? `<section class="col" style="gap:8px"><b class="h3">Populares</b><span class="xs muted">Los que más gente reúnen.</span>${popular.map(clubRow).join("")}</section>` : ""}
    ${list.length ? "" : `<div class="empty"><span class="ico">${ICON.users}</span><b>Ningún club con ese nombre</b><button class="btn sm soft" data-act="club-new" type="button">Crear uno</button></div>`}`;
}
LAYERS.club = {
  kind: "page",
  build({ id }) {
    const c = clubById(id), o = clubOverlap(c), member = isClubMember(c), total = c.works.length;
    const avs = [c.owner, ...c.members.filter(u => u !== c.owner)].slice(0, 5);
    const share = iconBtn("noop-toast", "share", "Compartir club", 'data-msg="En la app real se comparte un enlace al club"');

      <section class="club-hero">

        <span class="small muted">${plural(clubCount(c), "miembro", "miembros")} · ${c.join === "open" ? "Abierto" : "Con solicitud"} · Lo creó ${c.owner === S.me.username ? "tú" : "@" + esc(c.owner)}</span>
        <button class="club-people" data-act="club-members" data-id="${c.id}" type="button" aria-label="Ver los miembros"><span class="stackav">${avs.map(u => avatar(u, 32)).join("")}</span>${ICON.chev}</button>

      <section class="club-overlap">

        ${overlapBar(c, o)}
        <span class="small muted">${o.have.length === total ? "Las tienes todas: este club eres tú." : "No necesitas tenerlas todas para unirte. Las que te faltan son para descubrir."}</span>
      </section>
      <section class="col" style="gap:12px">
        <div class="between"><b class="h3">Las obras del club</b><span class="xs muted">${total} de ${CLUB_MAX}</span></div>

      </section>
      ${c.prompt ? `<section class="q-card"><span class="eyebrow">Pregunta de la semana</span><div class="q">${esc(c.prompt)}</div><span class="small muted">${member ? "Responde en la conversación con una obra de tu Bóveda." : "Únete para responder."}</span></section>` : ""}
      <section class="col" style="gap:4px">
        <b class="h3">Conversación</b>
        ${member ? `<div class="club-composer"><input class="input" id="club-msg" maxlength="280" placeholder="Escribe al club" autocomplete="off" aria-label="Mensaje para el club"><button class="btn sm" data-act="club-post" data-id="${c.id}" type="button">Enviar</button></div>` : ""}
        ${member || c.join === "open"
          ? (c.posts.length ? c.posts.map((p, i) => clubPost(p, c, i)).join("") : `<p class="small muted" style="margin:8px 0 0">Aún no hay mensajes. Abre la conversación.</p>`)
          : `<div class="empty"><span class="ico">${ICON.lock}</span><b>Solo para miembros</b><span>Este club acepta a quien lo solicita. Cuando te acepten verás la conversación.</span></div>`}
      </section>`, share);
  },
};
function clubWork(id, o, c) {
  const have = o.have.includes(id), want = o.want.includes(id);
  return `<div class="cw">
    <button class="cw-cover" data-act="obj-open" data-id="${id}" type="button" aria-label="${esc(ITEMS[id].title)}${have ? ", la tienes" : want ? ", en Quiero" : ""}">${cover(id, { fill: true })}${have ? `<span class="cw-mark">${ICON.check}</span>` : ""}</button>
    <span class="cw-t">${esc(ITEMS[id].title)}</span>
    ${have ? `<span class="xs muted">La tienes</span>` : want ? `<span class="xs muted">En Quiero</span>` : `<button class="chip cw-want" data-act="club-want" data-id="${id}" data-club="${c.id}" type="button">${icon("plus", 14)}Quiero</button>`}
  </div>`;
}
// Panel del dueño y de los admins: solicitudes por aceptar y acceso a los miembros
function clubManage(c) {
  const pend = c.join === "request" ? (c.pending || []) : [];
  return `<section class="club-manage">
    <div class="between"><b class="h3">${clubRole(c) === "owner" ? "Tu club" : "Eres admin"}</b><button class="btn sm ghost" data-act="club-members" data-id="${c.id}" type="button">Miembros</button></div>
    ${pend.length ? `<span class="small muted">${plural(pend.length, "solicitud", "solicitudes")} por revisar</span>${pend.map(u => `<div class="club-req">

}
// Cuántas obras del club tiene otra persona en su Bóveda (lo que ve el dueño al aceptar)
const clubOverlapOf = (c, u) => c.works.filter(id => (USERS[u]?.vault || []).some(v => v.id === id && v.status !== "wishlist")).length;
function clubPost(p, c, i) {

// CHATS: notas de 24 h, conversaciones, solicitudes y la conversación

TABS.chats = () => {
  const reqs = Object.entries(S.chats).filter(([u, c]) => c.request && !S.blocked.has(u));
  const main = Object.entries(S.chats).filter(([u, c]) => !c.request && !S.blocked.has(u));
  const list = S.chatSeg === "solicitudes" ? reqs : main;
  const notes = [S.me.username, ...Object.keys(USERS).filter(u => !S.blocked.has(u) && USERS[u].note && (S.me.following.has(u) || S.chats[u]))];
  return `<div class="scroll" data-scroll="chats">
    <div class="topbar"><div class="title">Chats</div>${iconBtn("new-chat", "edit", "Nuevo mensaje")}</div>
    <div class="content">
      <div class="notes" aria-label="Notas">${notes.map(u => {
        const mine = isMe(u), note = mine ? (S.me.note || "Comparte una nota") : USERS[u].note;
        return `<button class="note" data-act="${mine ? "edit-note" : "chat"}" data-id="${u}" type="button" aria-label="${mine ? "Tu nota" : `Nota de ${esc(USERS[u].name)}: ${esc(note)}`}"><span class="bubble ${mine && !S.me.note ? "empty" : ""}"><span class="bt">${esc(note)}</span></span>${avatar(u, 58)}<span class="nm">${mine ? "Tu nota" : esc(USERS[u].name)}</span></button>`;
      }).join("")}</div>
      ${seg("chatseg", [["principal", "Principal"], ["solicitudes", `Solicitudes${reqs.length ? ` (${reqs.length})` : ""}`]], S.chatSeg, { label: "Bandeja" })}
      ${S.chatSeg === "solicitudes" ? `<p class="xs muted" style="margin:-8px 4px 0">Mensajes de quien no sigues. No sabrán si los leíste hasta que aceptes.</p>` : ""}
      <div class="col" style="gap:2px">${list.length ? list.map(([u, c]) => convoRow(u, c)).join("") : `<div class="empty"><span class="ico">${ICON.chat}</span><b>${S.chatSeg === "solicitudes" ? "Sin solicitudes" : "Aún no tienes chats"}</b><span>${S.chatSeg === "solicitudes" ? "Aquí llegan los mensajes de quien no sigues." : "Reacciona a una obra en Descubrir para empezar."}</span></div>`}</div>
    </div>
  </div>`;
};
function convoRow(u, c) {
  const last = c.msgs[c.msgs.length - 1];
  const prev = last ? (last.card && !last.text ? `Compartió ${ITEMS[last.card].title}` : (last.from === "me" ? "Tú: " : "") + (last.text || "")) : "Di hola";
  return `<button class="convo ${c.unread ? "is-unread" : ""}" data-act="chat" data-id="${u}" type="button">${avatar(u, 52, { ring: !!USERS[u].moment, seen: S.seenMoments.has(u) })}<span class="grow"><b>${esc(USERS[u].name)}</b><span>${esc(prev)}</span></span>${c.unread ? `<span class="unread" aria-label="${c.unread} sin leer"></span>` : `<span class="xs muted">${c.request ? "" : "2 h"}</span>`}</button>`;
}

let chatTimer;
LAYERS.chat = {
  kind: "page",
  build({ user }) {

function sendChat(user, text, card, emoji) {
  const c = S.chats[user] || (S.chats[user] = { unread: 0, request: false, msgs: [] });
  c.msgs.push({ from: "me", text, card, emoji });

    const e2 = topLayer();
    if (e2 && e2.type === "chat" && e2.props.user === user) {
      $("#msgs", e2.el).insertAdjacentHTML("beforeend", '<span class="typing-dots" id="typing"><i></i><i></i><i></i></span>');

        $("#typing", e3.el)?.remove();
        $("#msgs", e3.el).insertAdjacentHTML("beforeend", msgHTML(c.msgs[c.msgs.length - 1], c.msgs.length - 1));
        const s = $("#chat-scroll", e3.el); s.scrollTop = s.scrollHeight;
        haptic(8);
      } else c.unread += 1;
    }, 1400);
  }, 700);
}

// ---------------------------------------------------------------- lógica de la Bóveda (igual que la base de datos)
function registerActivity() {
  const m = S.me;
  if (m.activeToday) return;
  m.activeToday = true;
  m.streak += 1;
  m.history[m.history.length - 1] = 1;
  const milestone = [3, 7, 30, 100, 365].includes(m.streak);
  setTimeout(() => {
    if (milestone) { confetti(90); toast(`¡${m.streak} días de racha! Nuevo hito`, "🔥"); }
    else toast(`Racha de ${m.streak} días. ¡Sigue así!`, "🔥");
    $$('[data-act="streak"] span').forEach(s => { if (/^\d+$/.test(s.textContent)) s.textContent = m.streak; });
  }, 900);
}
function closeRing(cat) {
  const m = S.me;
  if (m.week[cat]) return false;
  m.week[cat] = true;
  const n = weekCount();
  setTimeout(() => {
    if (n === 3) { m.weeklyStreak += 1; toast(`Semana cultural cumplida: ${m.weeklyStreak} semanas seguidas`, "◎"); }
    if (n === 5) { confetti(120); setTimeout(() => openLayer("week", { celebrate: true }), 700); }
  }, 1500);
  return true;
}
// Guarda en tu Bóveda (sin límite). Mientras tengas menos de 5 favoritas de ese tipo, entra a favoritas.
function vaultAdd(id, status = "finished") {
  const v = S.me.vault;
  let e = v.find(x => x.id === id);
  if (e) {
    if (e.status === "wishlist" || (status === "finished" && e.status !== "finished")) e.status = status;
    return { entry: e, added: false };
  }
  const cat = ITEMS[id].cat;
  const favs = favsOf(S.me.username, cat).length;
  e = { id, status, fav: status !== "wishlist" && favs < MAX_FAV ? favs + 1 : null, rating: null, added: Date.now() };
  v.push(e);
  return { entry: e, added: true };
}
function logItem(id, o = {}) {
  const status = o.status || "in_progress";
  S.me.diary.unshift({ item: id, day: "Hoy", status });
  const r = vaultAdd(id, status);
  const closedRing = closeRing(ITEMS[id].cat);
  if (!o.silent) registerActivity();
  return { ...r, closedRing };
}
function setFav(id, on) {
  const e = vEntry(S.me.username, id), cat = ITEMS[id].cat;
  if (!e) return false;
  const favs = favsOf(S.me.username, cat);
  if (on) {
    if (e.status === "wishlist") { toast("Las pendientes no pueden ser favoritas", "!"); return false; }
    if (favs.length >= MAX_FAV) { openLayer("edit-favs", { cat, adding: id }); return false; }
    e.fav = favs.length + 1;
  } else {
    e.fav = null;
    favsOf(S.me.username, cat).forEach((fid, i) => (vEntry(S.me.username, fid).fav = i + 1));
  }
  return true;
}
function setStatus(id, status) {
  const e = vEntry(S.me.username, id);
  if (!e) return;
  if (status === "wishlist" && e.fav) setFav(id, false);
  e.status = status;
}

}

// ---------------------------------------------------------------- Bóveda sin límite: filtros, orden y búsqueda
function vaultView(u) {
  const mine = isMe(u);
  const st = mine ? S : (S["vs_" + u] ||= { vaultCat: "all", vaultStatus: "all", vaultSort: "recent", vaultQ: "" });
  let list = vaultOf(u).filter(v => mine || !S.settings.hiddenCats.has(ITEMS[v.id].cat) || !mine);
  const counts = Object.fromEntries(CATS.map(c => [c.id, list.filter(v => ITEMS[v.id].cat === c.id).length]));
  if (st.vaultCat !== "all") list = list.filter(v => ITEMS[v.id].cat === st.vaultCat);
  if (st.vaultStatus !== "all") list = list.filter(v => st.vaultStatus === "fav" ? v.fav : v.status === st.vaultStatus);
  const q = (st.vaultQ || "").trim().toLowerCase();
  if (q) list = list.filter(v => (ITEMS[v.id].title + " " + ITEMS[v.id].creator).toLowerCase().includes(q));
  const sorters = { recent: (a, b) => b.added - a.added, rating: (a, b) => (b.rating || 0) - (a.rating || 0), az: (a, b) => ITEMS[a.id].title.localeCompare(ITEMS[b.id].title, "es"), year: (a, b) => ITEMS[b.id].year - ITEMS[a.id].year };
  list = list.slice().sort(sorters[st.vaultSort]);
  const statusOpts = [["all", "Todo"], ["fav", "★ Favoritas"], ["finished", "Terminadas"], ["in_progress", "En curso"], ["wishlist", "Pendientes"]];
  return `<div class="vault" data-u="${u}">
    <div class="between"><b>${plural(vaultOf(u).length, "obra", "obras")}</b>${mine ? `<button class="btn sm soft" data-act="add-to-vault" type="button">${icon("plus", 16)}Agregar</button>` : ""}</div>
    <div class="search">${ICON.search}<input class="input" id="vault-search" data-u="${u}" placeholder="Buscar en ${mine ? "tu" : "su"} Bóveda" value="${esc(st.vaultQ || "")}" autocomplete="off" aria-label="Buscar en la Bóveda"></div>
    <div class="chips">${chipBtn("vault-cat", "Todo", st.vaultCat === "all", `data-v="all" data-u="${u}"`)}${CATS.map(c => chipBtn("vault-cat", `${CAT_ICON[c.id]}${c.name} · ${counts[c.id]}`, st.vaultCat === c.id, `data-v="${c.id}" data-u="${u}"`)).join("")}</div>
    <div class="row vault-tools">
      <div class="chips grow" style="margin-right:0">${statusOpts.map(([v, l]) => chipBtn("vault-status", l, st.vaultStatus === v, `data-v="${v}" data-u="${u}"`)).join("")}</div>
    </div>
    <div class="row"><label class="label grow" for="vault-sort">Ordenar por</label><select class="input" id="vault-sort" data-u="${u}" style="width:auto;min-width:150px">${[["recent", "Recientes"], ["rating", "Calificación"], ["az", "A–Z"], ["year", "Año"]].map(([v, l]) => `<option value="${v}" ${st.vaultSort === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    ${list.length ? `<div class="vgrid">${list.map(v => `<button class="vcell" data-act="obj-open" data-id="${v.id}" data-owner="${u}" type="button" aria-label="${esc(ITEMS[v.id].title)}, ${esc(CAT[ITEMS[v.id].cat].st[v.status])}${v.fav ? ", favorita" : ""}"><span class="vc-cover">${cover(v.id, { fill: true })}${v.fav ? `<span class="vc-fav" aria-hidden="true">${icon("starFill", 13)}</span>` : ""}</span><span class="vc-t">${esc(ITEMS[v.id].title)}</span><span class="vc-s st-${v.status}">${esc(CAT[ITEMS[v.id].cat].st[v.status])}</span></button>`).join("")}</div>`
    : `<div class="empty"><span class="ico">${ICON.vault}</span><b>Nada con estos filtros</b><button class="btn sm soft" data-act="vault-reset" data-u="${u}" type="button">Quitar filtros</button></div>`}
  </div>`;
}

// ---------------------------------------------------------------- visor de obra
function stageObject(id) {
  const it = ITEMS[id];
  if (CAT[it.cat].obj === "vinyl") return `<button class="turntable playing" data-act="tt-toggle" type="button" aria-label="Pausar o reproducir el vinil"><span class="mat"><span class="tt-disc"><span class="label">${cover(id, { bare: true, fill: true })}</span><span class="hole"></span></span><span class="tt-sheen"></span></span><span class="arm"><i></i></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></button>`;
  return (CAT[it.cat].obj === "film" ? `<div class="beam" aria-hidden="true"></div>` : "") + obj(id, { book: 220, film: 200, tv: 210, cart: 200 }[CAT[it.cat].obj], { act: "stage-play" });
}
const holdersOf = id => Object.keys(USERS).filter(u => !S.blocked.has(u) && vEntry(u, id));
function stars(rating, id) {
  const n = Math.round((rating || 0) / 2);
  return `<div class="stars" role="radiogroup" aria-label="Tu calificación">${[1, 2, 3, 4, 5].map(k => `<button type="button" role="radio" aria-checked="${n === k}" data-act="rate" data-id="${id}" data-v="${k * 2}" aria-label="${k} de 5">${k <= n ? icon("starFill", 26) : icon("star", 26)}</button>`).join("")}</div>`;
}
LAYERS.viewer = {
  kind: "page",
  build({ id, owner }) {
    const it = ITEMS[id], c = CAT[it.cat], e = vEntry(S.me.username, id);
    const holders = holdersOf(id), n = 40 + (hash(id) % 260) + holders.length + (e ? 1 : 0);
    const other = owner && !isMe(owner) ? owner : null;
    const favs = favsOf(S.me.username, it.cat).length;
    return `<div class="scroll viewer">
      <div class="vbg" style="background:${coverBg(id)}" aria-hidden="true"></div><div class="vbg2" aria-hidden="true"></div>
      <div class="page-head">${iconBtn("close", "back", "Volver")}<div class="title"><span class="chip static">${CAT_ICON[it.cat]}${c.one}</span></div>${iconBtn("share-item", "share", "Compartir obra", `data-id="${id}"`)}</div>
      <div class="page-body viewer-body">
        <div class="stage-box">${stageObject(id)}</div>
        <div class="v-meta"><h2 class="v-title">${esc(it.title)}</h2><span class="muted">${esc([it.creator, it.year].filter(Boolean).join(" · "))}</span></div>
        <div class="v-live" id="v-info">${liveInfoHTML(id)}</div>
        ${other ? `<button class="who-has" data-act="react" data-id="${id}" data-user="${other}" type="button">${avatar(other, 38)}<span class="grow"><b>En la Bóveda de ${esc(USERS[other].name)}</b><span class="small muted">${e ? "También está en la tuya" : "Aún no está en la tuya"} · Toca para reaccionar</span></span>${ICON.chev.replace("<svg", '<svg class="chev"')}</button>` : ""}
        <section class="card col v-mine" style="gap:12px">
          ${e ? `<div class="between"><b>En tu Bóveda</b><button class="link-btn danger-text" data-act="remove" data-id="${id}" type="button">Quitar</button></div>
            ${seg("status-" + id, STATUS_ORDER.map(s => [s, c.st[s]]), e.status, { label: "Estado" })}
            <button class="fav-toggle ${e.fav ? "on" : ""}" data-act="toggle-fav" data-id="${id}" type="button" aria-pressed="${!!e.fav}" ${e.status === "wishlist" ? "disabled" : ""}>${e.fav ? icon("starFill", 20) : icon("star", 20)}<span class="grow"><b>${e.fav ? `Favorita #${e.fav} de ${c.plural.toLowerCase()}` : "Hacer favorita"}</b><span>${e.status === "wishlist" ? "Las pendientes no pueden ser favoritas" : `Salen en tu perfil · ${favs}/${MAX_FAV}`}</span></span></button>
            ${e.status === "finished" ? `<div class="between"><span class="small muted">Tu calificación</span>${stars(e.rating, id)}</div>` : ""}`
          : `<b>Guardar en tu Bóveda</b><span class="small muted" style="margin-top:-6px">Sin límite: guarda todo lo que quieras.</span>
            <div class="row save-opts">${STATUS_ORDER.map(s => `<button class="btn sm ${s === "finished" ? "" : "ghost"} grow" data-act="add-item" data-id="${id}" data-status="${s}" type="button">${c.st[s]}</button>`).join("")}</div>`}
        </section>
        <div class="v-actions">
          <button class="act-tile" data-act="log-item" data-id="${id}" type="button">${icon("rings", 22)}<b>Registrar hoy</b><span>${S.me.week[it.cat] ? "Anillo ya cerrado" : `Cierra tu anillo de ${c.name.toLowerCase()}`}</span></button>
          <button class="act-tile" data-act="post-with" data-id="${id}" type="button">${icon("photo", 22)}<b>Publicar con foto</b><span>La obra sale en la esquina</span></button>
          <button class="act-tile" data-act="now-with" data-id="${id}" type="button">${icon("sparkle", 22)}<b>Compartir como Ahora</b><span>Visible 24 horas</span></button>
          <button class="act-tile" data-act="buy" data-id="${id}" type="button">${icon("gift", 22)}<b>Dónde conseguirlo</b><span>Tiendas y plataformas</span></button>
        </div>
        ${liveWhereHTML(id)}
        <button class="who-has" data-act="noop-toast" data-msg="Aquí verás a quién más le gusta" type="button"><span class="stackav">${holders.slice(0, 4).map(u => avatar(u, 32)).join("")}</span><span class="grow"><b>En ${n} Bóvedas</b><span class="small muted">${holders.length ? holders.slice(0, 2).map(u => esc(USERS[u].name)).join(" y ") + (holders.length > 2 ? " y más" : "") + (holders.length === 1 ? " la tiene" : " la tienen") : "Sé de los primeros en guardarla"}</span></span></button>
        <p class="xs muted center" style="margin:0" id="v-credits">${creditsLine(id)}</p>
      </div>
    </div>`;
  },
  after(el, props, entry, isRefresh) {

    if (isRefresh) return;
    const o = $(".stage-box .obj", el);
    if (o) setTimeout(() => playObj(o), 420);
  },
};

const getKey = path => path.split(".").reduce((o, k) => o[k], S.settings);

const chev = () => ICON.chev.replace("<svg", '<svg class="chev"');
function navRow(layer, title, val = "", ico = "chev", sub = "") {

}
function actRow(act, title, sub, ico, extra = "", cls = "") {

}
function toggleRow(key, title, sub, ico, o = {}) {
  const on = o.invert ? !getKey(key) : !!getKey(key);

}
function radioGroup(key, opts, label) {

  return `<div class="group" role="radiogroup" aria-label="${esc(label || key)}">${opts.map(([v, l, s]) => `<button class="radio-row" type="button" role="radio" aria-checked="${cur === v}" data-act="radio" data-key="${key}" data-v="${v}"><span class="grow"><b>${l}</b>${s ? `<span class="sub">${s}</span>` : ""}</span><span class="rad"></span></button>`).join("")}</div>`;
}
function chipChoice(key, opts) {

function freshState() {
  const keep = { settings: S.settings, theme: S.me.theme, custom: S.me.custom, font: S.me.font };
  S = makeState();
  S.settings = keep.settings; S.me.theme = keep.theme; S.me.custom = keep.custom; S.me.font = keep.font;
}
function updateFollowButtons(u) {
  const on = S.me.following.has(u);
  $$(`[data-act="follow"][data-id="${u}"]`).forEach(b => { b.textContent = on ? "Siguiendo" : "Seguir"; b.classList.toggle("ghost", on); });
}
function updatePostButtons(p) {
  $$(`.post[data-post="${p.id}"]`).forEach(card => {
    const like = $('[data-act="like"]', card);
    if (like) {
      like.classList.toggle("liked", !!p.liked);
      like.setAttribute("aria-pressed", String(!!p.liked));
      like.innerHTML = `${p.liked ? ICON.heartFill : ICON.heart}${p.hideLikes && !isMe(p.user) ? "" : `<span class="like-count">${p.likes}</span>`}`;
    }
    const save = $('.post-actions [data-act="save"]', card);
    if (save) { const on = S.saved.has(p.id); save.classList.toggle("saved", on); save.setAttribute("aria-pressed", String(on)); save.innerHTML = on ? ICON.bookmarkFill : ICON.bookmark; }
    const cm = $('[data-act="comments"] span', card);
    if (cm) cm.textContent = p.comments.length;
  });
}
function likePost(id, fromDouble) {
  const p = findPost(id);
  if (!p) return;
  const media = $(`.post[data-post="${id}"] .post-media`) || $(`.post[data-post="${id}"]`);
  if (fromDouble && p.liked) { heartBurst(media); return; }
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  updatePostButtons(p);
  if (p.liked) { haptic(12); if (fromDouble) heartBurst(media); }
}
function openViewerFor(el) {
  const id = el.dataset.id, owner = el.dataset.owner;
  const d = el.classList.contains("obj") ? playObj(el) : 0;
  setTimeout(() => { openLayer("viewer", { id, owner }); setTimeout(() => resetObj(el), 900); }, Math.min(d, 650));
}
function storyList(startUser) {
  if (isMe(startUser)) return { list: [S.me.username], idx: 0 };
  const list = nowUsers();
  return { list, idx: Math.max(0, list.indexOf(startUser)) };
}

function refreshProfileOf(u) { if (isMe(u)) refresh(); else { const e = STACK.slice().reverse().find(x => x.type === "user" && x.props.user === u); if (e) refreshLayer(e); } }

let tapState = null;
const runAct = (el, ev) => { const fn = ACT[el.dataset.act]; if (fn) { fn(el, ev); afterAct(el.dataset.act); } };
document.addEventListener("click", ev => {
  const app = $("#app");
  if (!app.contains(ev.target) && !ev.target.closest(".toast")) return;
  const layer = ev.target.closest(".layer");
  if (layer && ev.target === layer && (layer.classList.contains("sheet") || layer.classList.contains("modal"))) { closeLayer(); return; }
  // doble toque en una publicación: me gusta (un toque abre lo que se tocó)
  const dbl = ev.target.closest("[data-dbl]");
  if (dbl && !ev.target.closest("button")) {
    if (tapState && tapState.el === dbl && Date.now() - tapState.t < 330) { clearTimeout(tapState.timer); tapState = null; likePost(dbl.dataset.dbl, true); return; }
    clearTimeout(tapState?.timer);
    const actEl = ev.target.closest("[data-act]");
    tapState = { el: dbl, t: Date.now(), timer: setTimeout(() => { tapState = null; if (actEl && dbl.contains(actEl)) runAct(actEl, ev); }, 300) };
    return;
  }
  // doble toque en un mensaje: corazón
  const msg = ev.target.closest(".msg[data-msg]");
  if (msg) {
    if (tapState && tapState.el === msg && Date.now() - tapState.t < 330) {
      tapState = null;
      const m = S.chats[topLayer().props.user].msgs[Number(msg.dataset.msg)];
      m.heart = !m.heart;
      const r = $(".react", msg);
      if (m.heart && !r) msg.insertAdjacentHTML("beforeend", '<span class="react">❤️</span>'); else r?.remove();
      haptic(10);
      return;
    }
    tapState = { el: msg, t: Date.now() };
  }
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled || el.getAttribute("aria-disabled") === "true" && el.dataset.act !== "noop-toast") return;
  if (el.tagName === "BUTTON" && el.type === "submit") return;
  ev.preventDefault();
  runAct(el, ev);
});

  ev.preventDefault();

// CUENTAS REALES (Supabase). Sin configuración, la app funciona solo con la cuenta de ejemplo.
// La pantalla nunca habla con la base directamente: aquí se carga lo tuyo al entrar y se
// guarda lo que cambias (Bóveda, favoritas, perfil, ambiente, a quién sigues).
// Las reglas de seguridad viven en la base (archivos 01 a 06): aunque alguien manipule la
// página, solo puede tocar lo suyo.
// =====================================================================
const CFG = window.BOVEDA_CONFIG || {};
const BE = {
  on: !!(CFG.url && CFG.key && window.supabase),
  sb: null,
  real: false,           // true = sesión con cuenta real; false = cuenta de ejemplo
  uid: null,
  cat: {}, back: {},     // id del prototipo ↔ uuid de cultural_items (catálogo curado)
  people: {},            // username real → uuid
  snap: null,            // lo último que se guardó, para mandar solo lo que cambió
  saving: Promise.resolve(),
};
if (BE.on) {
  BE.sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
}
const beErr = (e, fallback) => {
  const m = String(e?.message || e || "");
  if (/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if (/already registered|already exists/i.test(m)) return "Ya hay una cuenta con ese correo. Inicia sesión.";
  if (/rate limit/i.test(m)) return "Demasiados intentos. Espera un minuto y vuelve a intentar.";
  if (/network|fetch/i.test(m)) return "Sin conexión. Revisa tu internet.";
  return fallback || "Algo salió mal. Intenta de nuevo.";
};

// ---------------------------------------------------------------- cargar lo tuyo
async function beLoadCatalog() {
  if (Object.keys(BE.cat).length) return;
  const { data, error } = await BE.sb.from("cultural_items").select("id, external_id, cover_url").eq("source", "curado");
  if (error) throw error;
  data.forEach(r => {
    BE.cat[r.external_id] = r.id; BE.back[r.id] = r.external_id;
    const it = ITEMS[r.external_id];   // portada oficial ya verificada por alguien más (archivo 07)
    if (it && r.cover_url && it.img === undefined) { it.img = r.cover_url; it.fit = "cover"; }
  });
}
async function beHydrate() {
  await beLoadCatalog();
  const [{ data: p, error: e1 }, { data: v, error: e2 }, { data: f, error: e3 }] = await Promise.all([
    BE.sb.from("profiles").select("username, display_name, bio, theme, theme_custom, name_font, current_streak").eq("id", BE.uid).single(),
    BE.sb.from("vault_items").select("item_id, status, favorite_rank, rating, created_at, cultural_items(category, source, external_id, title, creator, release_year, cover_url)").eq("user_id", BE.uid),
    BE.sb.from("follows").select("following_id, profiles!follows_following_id_fkey(username)").eq("follower_id", BE.uid),
  ]);
  if (e1 || e2) throw e1 || e2;
  freshState();
  const m = S.me;
  m.username = p.username; m.name = p.display_name || p.username; m.bio = p.bio || ""; m.city = "";

  // Obras que encontraste en la búsqueda (no son del catálogo inicial): se registran con su id de fuente

// ---------------------------------------------------------------- guardar lo que cambió
function beSnapshot() {

  return {
    profile: JSON.stringify([m.name, m.bio, m.theme, m.font, m.theme === "tuyo" ? m.custom : null]),
    vault: new Map(m.vault.map(e => [e.id, `${e.status}|${e.fav ?? ""}|${e.rating ?? ""}`])),
    following: new Set(m.following),
  };
}
function beSync() {
  if (!BE.real) return;
  BE.saving = BE.saving.then(beSyncNow).catch(e => { console.error(e); toast("No se pudo guardar. Revisa tu conexión.", "!"); BE.snap = null; });
}
async function beSyncNow() {
  if (!BE.real) return;
  const prev = BE.snap || { profile: "", vault: new Map(), following: new Set() };
  const now = beSnapshot(), m = S.me, jobs = [];
  if (now.profile !== prev.profile) {
    const row = { display_name: m.name.slice(0, 50), bio: (m.bio || "").slice(0, 160) || null, name_font: m.font };
    // los ambientes de Bóveda+ los valida la base: si no aplica, el resto se guarda igual
    if (!PALETTES[m.theme]?.plus || S.me.premium) Object.assign(row, { theme: m.theme, theme_custom: m.theme === "tuyo" ? m.custom : null });
    jobs.push(BE.sb.from("profiles").update(row).eq("id", BE.uid));
  }
  // Bóveda: agregadas o con estado/calificación nueva; quitadas; favoritas por tipo
  // Obras nuevas de la búsqueda: primero entran al catálogo compartido (archivo 07)
  for (const [id] of now.vault) {
    const it = ITEMS[id];
    if (BE.cat[id] || !it?.src) continue;
    const { data: uuid, error } = await BE.sb.rpc("catalog_item", {
      p_category: it.cat, p_source: it.src, p_external_id: it.ext, p_title: it.title,
      p_creator: it.creator || null, p_year: Number.isInteger(+it.year) && +it.year ? +it.year : null, p_cover: it.img || null,
    });
    if (error) throw error;
    BE.cat[id] = uuid; BE.back[uuid] = id;
  }
  const upserts = [], removed = [], favCats = new Set();
  for (const [id, sig] of now.vault) {
    const old = prev.vault.get(id);
    if (old === sig) continue;
    const e = m.vault.find(x => x.id === id);
    if (BE.cat[id]) upserts.push({ user_id: BE.uid, item_id: BE.cat[id], status: e.status, rating: e.rating ?? null });
    if (!old || old.split("|")[1] !== String(e.fav ?? "")) favCats.add(ITEMS[id].cat);
  }
  for (const [id, sig] of prev.vault) if (!now.vault.has(id)) { if (BE.cat[id]) removed.push(BE.cat[id]); if (sig.split("|")[1]) favCats.add(ITEMS[id].cat); }
  if (upserts.length) {
    // primero sin favoritas (la base valida que una favorita no sea pendiente)
    const { error } = await BE.sb.from("vault_items").upsert(upserts, { onConflict: "user_id,item_id" });
    if (error) throw error;
  }
  if (removed.length) jobs.push(BE.sb.from("vault_items").delete().eq("user_id", BE.uid).in("item_id", removed));
  for (const cat of favCats) {
    const ids = m.vault.filter(e => ITEMS[e.id].cat === cat && e.fav && e.status !== "wishlist" && BE.cat[e.id])
      .sort((a, b) => a.fav - b.fav).slice(0, 5).map(e => BE.cat[e.id]);
    jobs.push(BE.sb.rpc("set_favorites", { p_category: cat, p_items: ids }));
  }
  // A quién sigues (solo personas reales)
  for (const u of now.following) if (!prev.following.has(u) && BE.people[u]) jobs.push(BE.sb.from("follows").insert({ follower_id: BE.uid, following_id: BE.people[u] }));
  for (const u of prev.following) if (!now.following.has(u) && BE.people[u]) jobs.push(BE.sb.from("follows").delete().eq("follower_id", BE.uid).eq("following_id", BE.people[u]));
  const res = await Promise.all(jobs);
  const bad = res.find(r => r?.error);
  if (bad) throw bad.error;
  BE.snap = now;
}

// ===== 12c_catalogo.js
// =====================================================================
// CATÁLOGO VIVO
//  1. Búsqueda global: obras (y personas y clubes), con espera de 300 ms entre teclas,
//     cancelación de búsquedas viejas, caché y filtro instantáneo por tipo de obra.
//  2. Ficha de cada obra: sinopsis con "Leer más", calificación de Bóveda y de la fuente,
//     IMDb y Rotten Tomatoes solo como enlace, y enlaces seguros (con el ícono de cada
//     plataforma) para verla, leerla, escucharla o comprarla.
//  3. Portadas oficiales verificadas (que existan, tamaño mínimo y proporción del
//     tipo de obra) con la portada ilustrada como respaldo.
//  4. Plantilla de ficha especial para libros (autor, editorial, páginas, ISBN…).
//
//  Fuentes sin clave: Open Library, MusicBrainz + Cover Art Archive, TVmaze, Wikipedia y
//  Wikidata. Con la función "obras" de Supabase (las claves secretas viven allá):
//  TMDB (películas) e IGDB (videojuegos).
//  En el prototipo (sin configuración) no se consulta nada de fuera.
// =====================================================================
const LIVE = !!(CFG.url && CFG.key);
const FN = LIVE && !!CFG.obras;

// ---------------------------------------------------------------- texto: normalizar y comparar
const STOPW = new Set(["el", "la", "los", "las", "lo", "the", "a", "an", "of", "de", "del", "y", "and", "en", "un", "una"]);
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/&/g, " y ").replace(/[^a-z0-9]+/g, " ").trim();
const toks = s => norm(s).split(" ").filter(w => w.length > 1 && !STOPW.has(w));
// Parecido entre dos textos, de 0 a 1 (palabras en común; 1 si son iguales)
function sim(a, b) {
  const A = norm(a), B = norm(b);
  if (!A || !B) return 0;
  if (A === B) return 1;
  if (A.includes(B) || B.includes(A)) return .5 + .5 * Math.min(A.length, B.length) / Math.max(A.length, B.length);
  const x = new Set(toks(a)), y = new Set(toks(b));
  if (!x.size || !y.size) return 0;
  let n = 0; x.forEach(w => { if (y.has(w)) n++; });
  return 2 * n / (x.size + y.size);
}
// ¿Este resultado es la misma obra? (título pesa más; autor y año confirman)
function matchScore(it, r) {
  const t = sim(it.title, r.title);
  const c = it.creator && r.creator ? sim(it.creator, r.creator) : .5;
  const y = it.year && r.year ? (Math.abs(+it.year - +r.year) <= 1 ? 1 : 0) : .5;
  return .65 * t + .25 * c + .1 * y;
}
// Temas de Open Library: sin etiquetas de biblioteca, idioma o traducción; sin repetidos
const SUBJ_NOISE = /^(fiction|ficcion|ficción|novela|novel|novels|literature|literatura|general)$|language|translation|readers|accessible|protected|daisy|library|lending|large type|staff pick|nyt:|award|reading level|in spanish|fiction, general/i;
function cleanSubjects(list) {
  const out = [];
  (list || []).forEach(s => { s = String(s).trim(); if (s.length > 2 && s.length < 28 && !SUBJ_NOISE.test(s) && !out.some(o => norm(o) === norm(s) || sim(o, s) > .8)) out.push(s); });
  return out.slice(0, 4);
}
const yr = d => { const n = parseInt(String(d || "").slice(0, 4), 10); return n > 999 && n < 2101 ? n : null; };
const https = u => (u ? String(u).replace(/^http:\/\//, "https://") : null);
const stripHTML = h => { const d = document.createElement("div"); d.innerHTML = String(h || ""); return d.textContent.replace(/\s+/g, " ").trim(); };

// ---------------------------------------------------------------- memoria del navegador (opcional)
const store = {
  get(k) { try { const v = JSON.parse(localStorage.getItem("bv2:" + k)); return v && v.e > Date.now() ? v.v : null; } catch (e) { return null; } },
  set(k, v, days) { try { localStorage.setItem("bv2:" + k, JSON.stringify({ v, e: Date.now() + days * 864e5 })); } catch (e) { /* sin espacio o bloqueado */ } },
};

// ---------------------------------------------------------------- red: con turnos por sitio y tiempo límite
const HOST_GAP = { "musicbrainz.org": 1100 };        // MusicBrainz pide máximo 1 consulta por segundo
const hostNext = {};
let inFlight = 0;
const waiters = [];
const slot = () => (inFlight < 5 ? (inFlight++, Promise.resolve()) : new Promise(r => waiters.push(r)));
const release = () => { const w = waiters.shift(); if (w) w(); else inFlight--; };
async function getJSON(url, { signal, ms = 10000 } = {}) {
  const host = new URL(url).host, gap = HOST_GAP[host] || 0;
  if (gap) {
    const now = Date.now(), at = Math.max(now, hostNext[host] || 0);
    hostNext[host] = at + gap;
    if (at > now) await new Promise(r => setTimeout(r, at - now));
  }
  if (signal?.aborted) throw new DOMException("cancelado", "AbortError");
  await slot();
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  const stop = () => ctl.abort();
  signal?.addEventListener("abort", stop);
  try {
    const r = await fetch(url, { signal: ctl.signal, headers: { Accept: "application/json" }, referrerPolicy: "no-referrer" });
    if (!r.ok) throw new Error(`${host} respondió ${r.status}`);
    return await r.json();
  } catch (e) {
    if (signal?.aborted) throw new DOMException("cancelado", "AbortError");
    throw e;
  } finally { clearTimeout(t); signal?.removeEventListener("abort", stop); release(); }
}
// Función "obras" en Supabase (TMDB e IGDB con claves secretas). Sin ella, devuelve null.
async function callObras(body, signal) {
  if (!FN) return null;
  try {
    const tok = BE.real ? (await BE.sb.auth.getSession())?.data?.session?.access_token : null;
    const r = await fetch(CFG.url + "/functions/v1/obras", {
      method: "POST", signal,
      headers: { "Content-Type": "application/json", apikey: CFG.key, Authorization: "Bearer " + (tok || CFG.key) },
      body: JSON.stringify(body),
    });
    return r.ok ? await r.json() : null;
  } catch (e) { if (e.name === "AbortError") throw e; return null; }
}

// ---------------------------------------------------------------- obras de fuera del catálogo inicial
// Cada obra encontrada vive en ITEMS como "x:<fuente>:<id>", igual que las del catálogo,
// así todas las pantallas (Bóveda, favoritas, perfil…) la muestran sin cambios.
const xid = (src, ext) => `x:${src}:${ext}`;
function addExternal(r) {
  const id = xid(r.src, r.ext);
  if (!ITEMS[id]) ITEMS[id] = { id, cat: r.cat, title: String(r.title || "Sin título"), creator: String(r.creator || ""), year: r.year || "", src: r.src, ext: String(r.ext), imgCand: r.img || null, extra: r.extra || {} };
  else if (!ITEMS[id].imgCand && r.img) ITEMS[id].imgCand = r.img;
  return id;
}
const luc = t => String(t).replace(/([+\-!(){}[\]^"~*?:\\/]|&&|\|\|)/g, "\\$1");
const OL_FIELDS = "key,title,author_name,first_publish_year,cover_i,ratings_average,ratings_count,editions,editions.cover_i,editions.language";
const olRow = x => ({ cat: "book", src: "openlibrary", ext: x.key, title: x.title, creator: x.author_name?.[0], year: x.first_publish_year,
  img: (x.editions?.docs?.[0]?.cover_i || x.cover_i) ? `https://covers.openlibrary.org/b/id/${x.editions?.docs?.[0]?.cover_i || x.cover_i}-L.jpg?default=false` : null });
const mbRow = x => ({ cat: "album", src: "musicbrainz", ext: x.id, title: x.title,
  creator: (x["artist-credit"] || []).map(a => (a.name || a.artist?.name || "") + (a.joinphrase || "")).join("").trim(),
  year: yr(x["first-release-date"]), img: `https://coverartarchive.org/release-group/${x.id}/front-500` });
const tvRow = s => ({ cat: "tv", src: "tvmaze", ext: String(s.id), title: s.name, creator: s.network?.name || s.webChannel?.name || "",
  year: yr(s.premiered), img: https(s.image?.original || s.image?.medium) });

// Fuentes por tipo de obra: buscar (lista) y encontrar una obra concreta (la mejor coincidencia)
const SRC = {
  book: {
    name: "Open Library",
    async search(q, signal) {
      const d = await getJSON(`https://openlibrary.org/search.json?limit=12&lang=es&fields=${OL_FIELDS}&q=${encodeURIComponent(q)}`, { signal });
      return (d.docs || []).map(olRow);
    },
    async find(it) {
      const d = await getJSON(`https://openlibrary.org/search.json?limit=6&lang=es&fields=${OL_FIELDS}&title=${encodeURIComponent(it.title)}&author=${encodeURIComponent(it.creator || "")}`);
      return (d.docs || []).map(olRow);
    },
  },
  album: {
    name: "MusicBrainz",
    async search(q, signal) {
      const e = luc(q);
      const d = await getJSON(`https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=10&query=${encodeURIComponent(`(releasegroup:(${e}) OR artist:(${e})) AND primarytype:album`)}`, { signal });
      return (d["release-groups"] || []).map(mbRow);
    },
    async find(it) {
      const q = `releasegroup:"${luc(it.title)}"` + (it.creator ? ` AND artist:"${luc(it.creator)}"` : "");
      const d = await getJSON(`https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=5&query=${encodeURIComponent(q)}`);
      return (d["release-groups"] || []).map(mbRow);
    },
  },
  tv: {
    name: "TVmaze",
    async search(q, signal) {
      const d = await getJSON(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`, { signal });
      return (d || []).slice(0, 10).map(x => tvRow(x.show));
    },
    async find(it) {
      const d = await getJSON(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(it.title)}`);
      return (d || []).slice(0, 5).map(x => tvRow(x.show));
    },
  },
  movie: {
    name: "TMDB", fn: true,
    async search(q, signal) { return (await callObras({ op: "search", cat: "movie", q }, signal))?.results || []; },
    async find(it) { return (await callObras({ op: "search", cat: "movie", q: it.title, year: it.year }))?.results || []; },
  },
  game: {
    name: "IGDB", fn: true,
    async search(q, signal) { return (await callObras({ op: "search", cat: "game", q }, signal))?.results || []; },
    async find(it) { return (await callObras({ op: "search", cat: "game", q: it.title }))?.results || []; },
  },
};
const srcReady = cat => LIVE && (!SRC[cat].fn || FN);

// Para obras del catálogo inicial: su ficha en la fuente oficial (se recuerda 30 días)
const REF = new Map();
async function refOf(it) {
  if (it.src) return { src: it.src, ext: it.ext, img: it.imgCand };
  if (REF.has(it.id)) return REF.get(it.id);
  const saved = store.get("ref:" + it.id);
  if (saved !== null) { REF.set(it.id, saved || null); return saved || null; }
  let best = null;
  if (srcReady(it.cat)) {
    try {
      const list = await SRC[it.cat].find(it);
      const top = list.map(r => [r, matchScore(it, r)]).sort((a, b) => b[1] - a[1])[0];
      if (top && top[1] >= .62) best = { src: top[0].src, ext: top[0].ext, img: top[0].img };
    } catch (e) { return null; }                     // sin red: se intenta otra vez después
  }
  REF.set(it.id, best);
  store.set("ref:" + it.id, best || "", best ? 30 : 3);
  return best;
}

// ---------------------------------------------------------------- portadas verificadas
// Proporción esperada por tipo y tolerancia: si no cuadra, la portada se muestra completa
// (contain) en vez de recortarla.
const RATIO = { album: [1, .12], movie: [2 / 3, .14], tv: [2 / 3, .2], book: [2 / 3, .25], game: [3 / 4, .2] };
function probe(url, ms = 9000) {
  return new Promise(res => {
    const im = new Image();
    im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => { im.src = ""; res(null); }, ms);
    im.onload = () => { clearTimeout(t); res({ w: im.naturalWidth, h: im.naturalHeight }); };
    im.onerror = () => { clearTimeout(t); res(null); };
    im.src = url;
  });
}
async function verifyCover(it, url) {
  const m = await probe(url);

    const d = FN ? await callObras({ op: "details", cat: "movie", ...(await refOf(it) || {}), title: it.title, year: it.year }) : null;
    return d || {};
  },
  async game(it) {
    const d = FN ? await callObras({ op: "details", cat: "game", ...(await refOf(it) || {}), title: it.title }) : null;
    return d || {};
  },
};
async function loadDetails(id) {
  if (DET.has(id)) return DET.get(id);
  const it = ITEMS[id];
  const saved = store.get("det:" + id);
  if (saved) { DET.set(id, saved); return saved; }
  if (!LIVE) return null;
  const d = { ok: true };
  try { Object.assign(d, await DETAIL[it.cat](it)); } catch (e) { d.ok = false; }
  // Sinopsis en español (Wikipedia) cuando existe; si no, la de la fuente
  try {
    const wd = d.qid ? await wikidata(d.qid) : null;
    const wk = await wikiES(it, wd?.eswiki || null);
    if (wk) { d.synopsis = wk.text; d.synSrc = { name: "Wikipedia (CC BY-SA)", url: wk.url }; d.qid = d.qid || wk.qid; }
    if ((it.cat === "movie" || it.cat === "tv") && d.qid && !d.imdb) d.imdb = (wd || await wikidata(d.qid))?.imdb || null;
  } catch (e) { /* sin Wikipedia: se queda la de la fuente */ }
  if (d.edCover && !it.img) {
    const ok = await verifyCover(it, d.edCover).catch(() => null);
    if (ok) { it.img = ok.u; it.fit = ok.f; store.set("cv:" + id, ok, 30); paintCover(id); saveCover(id, ok.u); }
  }
  DET.set(id, d);
  if (d.ok) store.set("det:" + id, d, 7);
  return d;
}
// Calificación de la comunidad: la real (archivo 07) o, en el prototipo, la de los perfiles de ejemplo
const COMM = new Map();
async function loadCommunity(id) {
  if (BE.real && BE.cat[id]) {
    const { data } = await BE.sb.rpc("item_community_rating", { p_item: BE.cat[id] });
    COMM.set(id, { avg: data?.avg ?? null, count: data?.count || 0 });
  } else {
    const rs = [...Object.keys(USERS).map(u => vEntry(u, id)?.rating), vEntry(S.me.username, id)?.rating].filter(r => r);
    COMM.set(id, { avg: rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : null, count: rs.length });
  }
  return COMM.get(id);
}

const fmt = v => (v == null || v === "" ? null : String(v));

// Ícono de cada plataforma: su propio favicon, tal cual lo publica (no redibujamos logotipos), a 64 px
// con el servicio de íconos de Google (el mismo proveedor de las tipografías: no suma terceros).
// Sin conexión, en el prototipo o si no carga: la inicial del nombre.
const FAV_HOST = { "open.spotify.com": "spotify.com", "store.steampowered.com": "steampowered.com", "store.playstation.com": "playstation.com" };
function favURL(url) {
  try { const h = new URL(url).hostname.replace(/^www\./, ""); return `https://www.google.com/s2/favicons?domain=${FAV_HOST[h] || h}&sz=64`; } catch (e) { return null; }
}
function brandMark(name, src, cls = "") {
  const ini = (String(name).match(/[\p{L}\p{N}]/u) || ["·"])[0].toUpperCase();
  const img = LIVE && src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : "";
  return `<span class="brand${cls ? " " + cls : ""}${img ? "" : " no-img"}" aria-hidden="true"><span class="brand-ini">${esc(ini)}</span>${img}</span>`;
}
document.addEventListener("error", e => {
  const t = e.target, b = t?.parentNode;
  if (t?.tagName === "IMG" && b?.classList?.contains("brand")) { b.classList.add("no-img"); t.remove(); }
}, true);
const NEW_TAB = `<span class="sr"> (se abre en otra pestaña)</span>`;

// Calificaciones: la de Bóveda y la que publica la propia fuente de los datos (Open Library, TVmaze, TMDB o IGDB).
// IMDb y Rotten Tomatoes solo como enlace: no copiamos sus calificaciones.
function rateCell(src, value, scale, note, url, cls = "") {
  const inner = `<span class="rt-src">${esc(src)}</span><span class="rt-val"><b>${esc(value ?? "—")}</b>${value != null && scale ? `<small>${esc(scale)}</small>` : ""}</span><span class="rt-note">${esc(note || "")}</span>`;
  return url ? `<a class="rate-cell ${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${inner}${NEW_TAB}</a>` : `<div class="rate-cell ${cls}">${inner}</div>`;
}
const extChip = (name, url, label) => `<a class="ext-chip" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${brandMark(name, favURL(url), "sm")}<span>${esc(label)}</span>${icon("external", 16)}${NEW_TAB}</a>`;
function ratingsHTML(it, d) {
  const cm = COMM.get(it.id);
  const cells = [rateCell("Bóveda", cm ? (cm.avg != null ? cm.avg.toFixed(1) : null) : "…", "/10", cm ? (cm.count ? plural(cm.count, "voto", "votos") : "Sin votos todavía") : "Cargando", null, "rc-boveda")];
  (d?.extra || []).forEach(r => cells.push(rateCell(r.src, r.value, r.scale, r.count ? plural(r.count, "voto", "votos") : "", r.url)));
  let links = "";
  if (it.cat === "movie" || it.cat === "tv") {
    const imdb = IMDB_RE.test(d?.imdb || "") ? `https://www.imdb.com/title/${d.imdb}/` : `https://www.imdb.com/find/?q=${encodeURIComponent(it.title)}`;
    links = `<div class="rate-links" role="group" aria-label="Calificaciones en otros sitios">${extChip("IMDb", imdb, "IMDb")}${extChip("Rotten Tomatoes", `https://www.rottentomatoes.com/search?search=${encodeURIComponent(it.title)}`, "Rotten Tomatoes")}</div>`;
  }
  return `<section class="v-section" aria-labelledby="v-rate-t"><span class="eyebrow" id="v-rate-t">Calificaciones</span><div class="rate-strip">${cells.join("")}</div>${links}</section>`;
}
function synopsisHTML(it, d) {
  if (!LIVE) return "";
  if (!d) return `<section class="v-section"><span class="eyebrow">Sinopsis</span><span class="skel ln"></span><span class="skel ln"></span><span class="skel ln short"></span></section>`;
  if (!d.synopsis) return "";
  const long = d.synopsis.length > 280;
  return `<section class="v-section" aria-labelledby="v-syn-t"><span class="eyebrow" id="v-syn-t">Sinopsis</span>
    <p class="syn${long ? " clamp" : ""}" id="v-syn">${esc(d.synopsis)}</p>
    ${long ? `<button class="link-btn syn-more" data-act="syn-toggle" type="button" aria-expanded="false" aria-controls="v-syn">Leer más</button>` : ""}
    ${d.synSrc ? `<span class="xs muted v-src">Fuente: <a href="${esc(d.synSrc.url)}" target="_blank" rel="noopener noreferrer">${esc(d.synSrc.name)}${NEW_TAB}</a></span>` : ""}
  </section>`;
}
// Ficha técnica: renglones con línea fina (etiqueta a la izquierda, dato a la derecha)
const factRow = ([k, v]) => `<div class="fact"><dt>${esc(k)}</dt><dd${k === "ISBN" ? ' class="mono"' : ""}>${esc(String(v))}</dd></div>`;
// Plantilla dedicada para libros
function bookSheetHTML(it, d) {
  const b = d?.book || { author: it.creator, firstYear: it.year };
  const F = [["Autor", b.author], ["Editorial", b.publisher], ["Primera publicación", b.firstYear], ["Esta edición", b.editionYear], ["Páginas", b.pages], ["Idioma", b.lang], ["ISBN", b.isbn], ["Ediciones", b.editions]].filter(f => fmt(f[1]));
  const lead = [b.pages && plural(+b.pages, "página", "páginas"), b.publisher, b.lang].filter(Boolean).join(" · ");
  return `<section class="v-section" aria-labelledby="v-book-t"><span class="eyebrow" id="v-book-t">Ficha del libro</span>
    <div class="spec book-sheet">
      ${lead ? `<p class="bs-lead">${esc(lead)}</p>` : ""}
      <dl class="facts">${F.map(factRow).join("")}</dl>
      ${b.subjects?.length ? `<div class="bs-tags" aria-label="Temas">${b.subjects.map(s => `<span class="chip static">${esc(s)}</span>`).join("")}</div>` : ""}
    </div>
    ${d?.book ? `<span class="xs muted">Edición de referencia según Open Library${b.lang === "Español" ? " (en español)" : ""}.</span>` : LIVE && !d ? `<span class="skel ln short"></span>` : ""}
  </section>`;
}
function factsHTML(it, d) {
  const who = { album: "Artista", movie: "Dirección", tv: "Cadena", game: "Estudio", book: "Autor" }[it.cat];
  const F = (d?.facts || [[who, it.creator], ["Año", it.year]]).filter(f => fmt(f[1]));
  if (!F.length) return "";
  return `<section class="v-section" aria-labelledby="v-facts-t"><span class="eyebrow" id="v-facts-t">Ficha técnica</span><dl class="spec facts">${F.map(factRow).join("")}</dl></section>`;
}
// Dónde verla, leerla, escucharla o comprarla: [nombre, enlace, qué ofrece, logotipo (si la fuente lo da)]
function whereLinks(it, d) {
  const t = encodeURIComponent(it.title), ta = encodeURIComponent(`${it.title} ${it.creator || ""}`.trim());
  const jw = ["JustWatch", `https://www.justwatch.com/mx/buscar?q=${t}`, "Todas las plataformas"];
  const L = {
    book: [["Amazon México", `https://www.amazon.com.mx/s?k=${ta}&i=stripbooks`, "Comprar"], ["Gandhi", `https://www.gandhi.com.mx/catalogsearch/result/?q=${ta}`, "Comprar"], ["Open Library", d?.synSrc?.name === "Open Library" ? d.synSrc.url : `https://openlibrary.org/search?q=${ta}`, "Leer o pedir prestado"]],
    album: [["Spotify", `https://open.spotify.com/search/${ta}`, "Escuchar"], ["Apple Music", `https://music.apple.com/mx/search?term=${ta}`, "Escuchar"], ["YouTube Music", `https://music.youtube.com/search?q=${ta}`, "Escuchar"]],
    movie: [...(d?.providers || []).map(p => [p.name, p.url, p.kind, /^https:\/\/image\.tmdb\.org\//.test(p.logo || "") ? p.logo : null]), jw],
    tv: [d?.official && ["Sitio oficial", d.official, "Ver la serie"], jw],
    game: [["Steam", `https://store.steampowered.com/search/?term=${t}`, "Comprar"], ["Nintendo eShop", `https://www.nintendo.com/es-mx/search/#q=${t}`, "Comprar"], ["PlayStation Store", `https://store.playstation.com/es-mx/search/${t}`, "Comprar"], ["Xbox", `https://www.xbox.com/es-MX/search/results?q=${t}`, "Comprar"]],
  }[it.cat].filter(Boolean).filter(l => /^https:\/\//.test(l[1]));
  const verb = { book: "Dónde leerlo o comprarlo", album: "Dónde escucharlo", movie: "Dónde verla", tv: "Dónde verla", game: "Dónde jugarlo" }[it.cat];
  return `<section class="v-section" id="v-where" aria-labelledby="v-where-t"><span class="eyebrow" id="v-where-t">${verb}</span>
    <div class="spec where-list">${L.map(([name, url, kind, img]) => `<a class="where-row" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${brandMark(name, img === undefined ? favURL(url) : img)}<span class="grow"><b>${esc(name)}</b><span>${esc(kind)}</span></span>${icon("external", 18)}${NEW_TAB}</a>`).join("")}</div>
    <span class="xs muted">Cada enlace abre el sitio de la plataforma. Bóveda no vende ni cobra por estos enlaces.</span>
  </section>`;
}
function liveInfoHTML(id) {
  const it = ITEMS[id], d = DET.get(id) || null;
  return synopsisHTML(it, d) + ratingsHTML(it, d) + (it.cat === "book" ? bookSheetHTML(it, d) : factsHTML(it, d));
}
const liveWhereHTML = id => whereLinks(ITEMS[id], DET.get(id) || null);
function creditsLine(id) {
  const it = ITEMS[id], d = DET.get(id);
  if (!LIVE) return `Datos y portada en la app publicada: ${esc(CAT[it.cat].src)}. Aquí la portada es una ilustración del prototipo.`;
  return `Datos: ${esc(d?.source || CAT[it.cat].src)}${d?.synSrc?.name?.startsWith("Wikipedia") ? " y Wikipedia" : ""}. ${it.img ? "Portada de la fuente oficial." : "Portada ilustrada mientras encontramos la oficial."}`;
}
// Se llama desde la ficha (10b_pages.js): pinta lo que ya se sabe y completa al llegar
function paintDetails(id, el) {
  const fill = () => {
    if (!el.isConnected) return;
    const a = $("#v-info", el), b = $("#v-where", el), c = $("#v-credits", el);
    if (a) a.innerHTML = liveInfoHTML(id);
    if (b) b.outerHTML = liveWhereHTML(id);
    if (c) c.innerHTML = creditsLine(id);
  };
  loadCommunity(id).then(fill, () => {});
  if (LIVE && !DET.has(id)) loadDetails(id).then(fill, fill);
  resolveCover(id);
}
